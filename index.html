<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1526">
<link rel="manifest" href="manifest.json">
<meta name="color-scheme" content="light">
<meta name="application-name" content="CONTROL">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CONTROL">
<meta name="description" content="CONTROL · gestión financiera: ingresos, gastos, facturación y ganancia neta absoluta.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1526'/%3E%3Cpath d='M18 42l9-9 7 6 12-14' stroke='%2334d399' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>CONTROL · Gestión financiera</title>
<style>
:root{
  --bg:#f4f6f8;--surface:#fff;--surface-2:#f8fafc;--surface-3:#f2f5f8;
  --ink:#0f172a;--ink-2:#344054;--muted:#667085;--muted-2:#98a2b3;
  --line:#e4e7ec;--line-2:#eef2f6;
  --brand:#0f5c63;--brand-2:#0e7490;--brand-soft:#e6f5f4;
  --navy:#0b1526;--navy-2:#111f35;--navy-3:#1a2b45;
  --success:#067647;--success-soft:#ecfdf3;--success-line:#abefc6;
  --warn:#b54708;--warn-soft:#fffaeb;--warn-line:#fedf89;
  --danger:#b42318;--danger-soft:#fef3f2;--danger-line:#fecdca;
  --info:#175cd3;--info-soft:#eff8ff;--info-line:#b2ddff;
  --purple:#6941c6;--purple-soft:#f4f3ff;--purple-line:#d9d6fe;
  --gold:#a15c07;--gold-soft:#fff7e6;--gold-line:#fedf89;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 8px 24px rgba(16,24,40,.07);
  --shadow-lg:0 24px 64px rgba(16,24,40,.18);
  --radius:14px;--radius-sm:10px;--radius-lg:20px;--sidebar:256px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.modal-open{overflow:hidden}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.6}
:focus-visible{outline:3px solid rgba(14,116,144,.35);outline-offset:2px}
.skip-link{position:fixed;left:12px;top:-60px;z-index:200;background:#fff;color:var(--ink);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-weight:700}
.skip-link:focus{top:12px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.nowrap{white-space:nowrap}
.right{text-align:right}
.center{text-align:center}
.hidden{display:none!important}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.stack{display:grid;gap:10px}
.divider{height:1px;background:var(--line);margin:16px 0}

/* Shell */
.app-shell{min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:linear-gradient(180deg,var(--navy),#0a1220);color:#d6dee9;display:flex;flex-direction:column;padding:20px 14px 16px;z-index:60;border-right:1px solid rgba(255,255,255,.06)}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 22px;color:#fff}
.brand-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#22c1a8,#0e7490 55%,#155e75);display:grid;place-items:center;box-shadow:0 8px 20px rgba(14,116,144,.35);flex:none}
.brand-mark svg{width:21px;height:21px;color:#fff}
.brand-name{font-weight:800;letter-spacing:.14em;font-size:13px;line-height:1.1}
.brand-sub{font-size:10px;color:#8fa1b7;letter-spacing:.18em;margin-top:4px}
.sidebar-scroll{overflow:auto;flex:1;scrollbar-width:thin}
.nav-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#72849b;font-weight:700;padding:16px 10px 7px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:#aebbd0;padding:9px 10px;border-radius:9px;font-size:13px;font-weight:600;text-align:left;margin:1px 0;transition:.14s}
.nav-item svg{width:18px;height:18px;flex:none;opacity:.9}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(34,193,168,.13);color:#fff;box-shadow:inset 2px 0 0 #2dd4bf}
.nav-item .badge{margin-left:auto;background:rgba(255,255,255,.12);color:#fff;border-radius:99px;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center;font-size:10px;font-weight:800}
.nav-item.active .badge{background:#2dd4bf;color:#052e2b}
.sidebar-new{margin:16px 4px 6px;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#22c1a8,#0e7490);color:#042f2e;border:0;border-radius:10px;padding:11px 12px;font-weight:800;font-size:12.5px;letter-spacing:.02em;box-shadow:0 10px 24px rgba(14,116,144,.3)}
.sidebar-new:hover{filter:brightness(1.05)}
.sidebar-foot{padding:14px 8px 2px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:#8293a9}
.sidebar-foot .row{justify-content:space-between}
.sidebar-foot a{color:#a9bacd}
.sidebar-foot a:hover{color:#fff}
.status-dot{width:7px;height:7px;border-radius:50%;background:#2dd4bf;display:inline-block;box-shadow:0 0 0 3px rgba(45,212,191,.16);margin-right:6px}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(8,15,26,.55);z-index:50;backdrop-filter:blur(2px)}
.sidebar-overlay.show{display:block}
.main{min-height:100vh;margin-left:var(--sidebar);display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:35;height:68px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 28px}
.mobile-menu{display:none;border:1px solid var(--line);background:#fff;border-radius:9px;width:38px;height:38px;place-items:center;color:var(--ink-2)}
.search-wrap{position:relative;width:min(480px,46vw)}
.search-box{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:0 10px;height:40px;transition:.15s}
.search-box:focus-within{background:#fff;border-color:#99d5d0;box-shadow:0 0 0 3px rgba(14,116,144,.1)}
.search-box svg{width:17px;height:17px;color:var(--muted);flex:none}
.search-box input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:var(--ink);font-size:13.5px}
.search-box kbd{font-size:10px;border:1px solid var(--line);border-bottom-width:2px;background:#fff;border-radius:5px;padding:2px 5px;color:var(--muted)}
.search-dropdown{position:absolute;top:47px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden;z-index:80;max-height:min(440px,70vh);overflow-y:auto}
.search-head{padding:9px 12px;border-bottom:1px solid var(--line-2);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;background:var(--surface-2)}
.search-result{display:flex;align-items:center;gap:10px;width:100%;border:0;background:#fff;padding:10px 12px;text-align:left;border-bottom:1px solid var(--line-2)}
.search-result:hover,.search-result:focus{background:var(--brand-soft)}
.search-result:last-child{border-bottom:0}
.search-result .icon-chip{width:30px;height:30px;border-radius:8px;background:var(--surface-3);display:grid;place-items:center;flex:none;color:var(--brand)}
.search-result .icon-chip svg{width:15px;height:15px}
.search-result .sr-main{min-width:0;flex:1}
.search-result .sr-title{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-result .sr-detail{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-result .sr-amount{font-size:11.5px;font-weight:800;white-space:nowrap}
.search-empty{padding:16px;color:var(--muted);font-size:12px;text-align:center}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#e2f6f1,#c7ebe5);color:#0f5c63;display:grid;place-items:center;font-size:11px;font-weight:900;border:1px solid #bfe5df;margin-left:4px;letter-spacing:.02em}
.content{width:100%;max-width:1640px;margin:0 auto;padding:26px 28px 42px;flex:1}
.bottom-nav{display:none}

/* Page head */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:20px;flex-wrap:wrap}
.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--brand);font-weight:900;margin-bottom:6px}
.page-title{margin:0;font-size:26px;line-height:1.12;letter-spacing:-.025em;font-weight:800;color:var(--ink)}
.page-sub{margin:7px 0 0;color:var(--muted);font-size:13px;max-width:760px}
.page-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink-2);border-radius:9px;padding:9px 13px;font-size:12.5px;font-weight:700;line-height:1;transition:.14s;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:#cfd6df;text-decoration:none}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 3px 10px rgba(15,92,99,.18)}
.btn-primary:hover{background:#0c4d53;border-color:#0c4d53}
.btn-soft{background:var(--brand-soft);border-color:#c4e7e2;color:var(--brand)}
.btn-soft:hover{background:#d9f2ee}
.btn-danger{background:var(--danger-soft);border-color:var(--danger-line);color:var(--danger)}
.btn-danger:hover{background:#fde7e3}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--surface-3);color:var(--ink)}
.btn-sm{padding:7px 10px;font-size:11.5px;border-radius:8px}
.btn-sm svg{width:13px;height:13px}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:8px;padding:0}
.icon-btn:hover{background:var(--surface-3);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}
.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger)}
.btn .spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;border-bottom:1px solid var(--line-2)}
.panel-title{margin:0;font-size:13.5px;font-weight:800;letter-spacing:-.01em}
.panel-sub{font-size:11px;color:var(--muted);margin-top:2px}
.panel-body{padding:16px}
.panel-foot{padding:11px 16px;border-top:1px solid var(--line-2);background:var(--surface-2);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--muted)}
.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid-dash{grid-template-columns:minmax(0,1.55fr) minmax(320px,.85fr)}
.kpi-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 15px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--kpi-tone,var(--brand));opacity:.85}
.kpi-head{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.kpi-icon{width:28px;height:28px;border-radius:8px;background:var(--kpi-soft,var(--brand-soft));color:var(--kpi-tone,var(--brand));display:grid;place-items:center;flex:none}
.kpi-icon svg{width:15px;height:15px}
.kpi-value{font-size:21px;font-weight:850;letter-spacing:-.035em;margin-top:12px;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-note{font-size:10.5px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.negative{--kpi-tone:var(--danger);--kpi-soft:var(--danger-soft)}
.kpi.positive{--kpi-tone:var(--success);--kpi-soft:var(--success-soft)}
.kpi.warn{--kpi-tone:var(--warn);--kpi-soft:var(--warn-soft)}
.kpi.info{--kpi-tone:var(--info);--kpi-soft:var(--info-soft)}
.kpi.purple{--kpi-tone:var(--purple);--kpi-soft:var(--purple-soft)}
.kpi.gold{--kpi-tone:var(--gold);--kpi-soft:var(--gold-soft)}

/* Badges */
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;border-radius:99px;padding:3px 8px;font-size:10.5px;font-weight:800;line-height:1.2;white-space:nowrap}
.pill svg{width:11px;height:11px}
.pill-success{background:var(--success-soft);color:var(--success);border-color:var(--success-line)}
.pill-warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.pill-danger{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-line)}
.pill-info{background:var(--info-soft);color:var(--info);border-color:var(--info-line)}
.pill-neutral{background:var(--surface-3);color:var(--muted);border-color:var(--line)}
.pill-purple{background:var(--purple-soft);color:var(--purple);border-color:var(--purple-line)}
.pill-gold{background:var(--gold-soft);color:var(--gold);border-color:var(--gold-line)}
.priority{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--muted)}
.priority::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted-2)}
.priority.alta::before{background:var(--warn)}
.priority.urgente::before{background:var(--danger);box-shadow:0 0 0 3px rgba(180,35,24,.12)}
.priority.baja::before{background:var(--info)}
.priority.normal::before{background:var(--muted-2)}

/* Banner */
.alert-banner{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1px solid var(--warn-line);background:linear-gradient(135deg,#fffaf0,#fff);border-radius:12px;margin-bottom:16px}
.alert-banner .alert-icon{width:34px;height:34px;border-radius:9px;background:var(--warn-soft);color:var(--warn);display:grid;place-items:center;flex:none}
.alert-banner .alert-icon svg{width:17px;height:17px}
.alert-banner strong{display:block;font-size:12.5px;margin-bottom:2px}
.alert-banner span{font-size:11.5px;color:var(--muted)}
.alert-banner .btn{margin-left:auto}

/* Tables */
.table-wrap{overflow:auto;border-radius:10px;border:1px solid var(--line-2);background:#fff}
table.data{width:100%;border-collapse:collapse;font-size:12px;min-width:620px}
table.data th{position:sticky;top:0;z-index:2;background:var(--surface-2);color:var(--muted);font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:900;text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data td{padding:9px 11px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.data tbody tr:last-child td{border-bottom:0}
table.data tbody tr:hover{background:#fbfcfd}
table.data td.num,table.data th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.data .main-cell{font-weight:700;color:var(--ink);max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.data .sub-cell{font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.data tr.row-danger{background:#fffafa}
table.data tr.row-warn{background:#fffdf7}
table.data td.actions{white-space:nowrap;text-align:right}
.table-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.table-note{font-size:11px;color:var(--muted)}
.hist-table{min-width:1420px}
.hist-table th:first-child,.hist-table td:first-child{position:sticky;left:0;z-index:3;background:#fff;box-shadow:1px 0 0 var(--line-2)}
.hist-table th:first-child{background:var(--surface-2);z-index:4}
.hist-table td.hist-period{font-weight:800;white-space:nowrap}
.hist-table .future-row{background:#fcfcfd}
.hist-table .future-row td{color:var(--muted)}
.anual-table{min-width:1080px}
.annual-note{margin-top:14px}
.mini-summary{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.mini-summary b{color:var(--ink);font-variant-numeric:tabular-nums}
.money-pos{color:var(--success)}
.money-neg{color:var(--danger)}

/* Progress */
.progress{height:7px;background:var(--surface-3);border-radius:99px;overflow:hidden;position:relative}
.progress>span{display:block;height:100%;background:var(--success);border-radius:99px;transition:width .35s}
.progress.medio>span{background:#eaaa08}
.progress.alto>span{background:#dc6803}
.progress.critico>span{background:var(--danger)}
.progress.slim{height:5px}
.budget-list{display:grid;gap:12px}
.budget-item{border:1px solid var(--line-2);border-radius:10px;padding:12px 13px;background:#fff}
.budget-item-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.budget-name{font-size:12.5px;font-weight:800}
.budget-meta{font-size:10.5px;color:var(--muted)}
.budget-line{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted);margin-top:7px}
.budget-line b{color:var(--ink);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}

/* Charts */
.bar-chart{display:flex;align-items:flex-end;gap:9px;height:180px;padding:10px 4px 0;border-bottom:1px solid var(--line-2)}
.bar-col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px}
.bar-pair{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center}
.bar{width:38%;max-width:20px;min-height:3px;border-radius:4px 4px 0 0;background:#b9e6df;transition:.2s}
.bar.expense{background:#f4b8ad}
.bar:hover{filter:brightness(.94)}
.bar-label{font-size:9.5px;color:var(--muted);white-space:nowrap}
.chart-legend{display:flex;gap:14px;margin-top:10px;font-size:10.5px;color:var(--muted)}
.chart-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.dash-list{display:grid;gap:2px}
.dash-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line-2)}
.dash-row:last-child{border-bottom:0}
.dash-row .dr-icon{width:30px;height:30px;border-radius:8px;background:var(--surface-3);display:grid;place-items:center;flex:none;color:var(--muted)}
.dash-row .dr-icon svg{width:14px;height:14px}
.dash-row .dr-main{min-width:0;flex:1}
.dash-row .dr-title{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-row .dr-sub{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-row .dr-value{font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.invest-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.invest-card{padding:16px;display:flex;flex-direction:column;gap:12px}
.invest-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.invest-title{font-size:14px;font-weight:800;letter-spacing:-.01em}
.invest-sub{font-size:10.5px;color:var(--muted);margin-top:3px}
.invest-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:10px 0;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.invest-kpi span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}
.invest-kpi b{display:block;font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}
.roi{font-size:11px;font-weight:800}

/* Filter bar */
.filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.filterbar .field-inline{display:flex;align-items:center;gap:6px}
.filterbar label{font-size:10.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.filterbar input,.filterbar select{height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 9px;font-size:12px;color:var(--ink)}
.filterbar input[type=search]{min-width:190px}
.filterbar .search-mini{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;padding:0 9px;height:34px;background:#fff;flex:1;min-width:190px;max-width:360px}
.filterbar .search-mini svg{width:14px;height:14px;color:var(--muted)}
.filterbar .search-mini input{border:0;outline:0;height:auto;padding:0;flex:1;min-width:0}
.adv-filterbar{gap:9px}
.adv-filterbar .adv-title{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:8px;background:var(--surface-3);color:var(--ink-2);font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}
.adv-filterbar .adv-title svg{width:13px;height:13px;color:var(--brand)}
.adv-filterbar .adv-count{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--brand);color:#fff;font-size:10px}
.adv-filterbar .adv-sep{color:var(--muted);font-size:11px}
.adv-filterbar input[type=number]{width:86px}
.adv-filterbar input[type=date]{width:132px}
.adv-filterbar .search-mini{max-width:300px}
.row-optimista{background:linear-gradient(90deg,#eefaf6,#fff)!important;animation:rowIn .24s ease}
.row-optimista td{color:var(--muted)}
.row-optimista .row-pending{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;color:var(--brand);white-space:nowrap}
.row-optimista .row-pending .spin{width:11px;height:11px;border-width:2px;margin:0}
@keyframes rowIn{from{opacity:.4;transform:translateY(-3px)}to{opacity:1;transform:none}}

/* Empty/loading */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:34px 18px;color:var(--muted)}
.empty-icon{width:46px;height:46px;border-radius:13px;background:var(--surface-3);display:grid;place-items:center;color:var(--muted);margin-bottom:10px}
.empty-icon svg{width:22px;height:22px}
.empty h4{margin:0 0 4px;color:var(--ink);font-size:13px}
.empty p{margin:0 0 12px;font-size:11.5px;max-width:330px}
.skeleton{background:linear-gradient(90deg,#eef1f5 25%,#f7f9fb 50%,#eef1f5 75%);background-size:220% 100%;animation:shimmer 1.2s infinite;border-radius:8px}
@keyframes shimmer{to{background-position:-220% 0}}
.loading-page{padding:40px}
.loading-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:20px}
.loading-grid .skeleton{height:100px}
.loading-page .skeleton.title{height:28px;width:260px;margin-top:22px}
.boot-screen{min-height:100vh;display:grid;place-items:center;background:var(--bg)}
.boot-card{text-align:center;color:var(--muted)}
.boot-logo{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,#22c1a8,#0e7490);display:grid;place-items:center;color:#fff;margin:0 auto 14px;box-shadow:0 14px 32px rgba(14,116,144,.25)}
.boot-logo svg{width:26px;height:26px}
.boot-card b{display:block;color:var(--ink);font-size:14px;letter-spacing:.03em}
.boot-card span{font-size:11.5px}
.spinner{width:26px;height:26px;border:2.5px solid #d9e2e8;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:14px auto 0}
.error-page{min-height:70vh;display:grid;place-items:center;padding:30px}
.error-card{max-width:520px;text-align:center}
.error-card .empty-icon{margin:0 auto 12px;background:var(--danger-soft);color:var(--danger)}
.error-card h2{margin:0 0 6px;font-size:20px}
.error-card p{color:var(--muted);font-size:13px;margin:0 0 16px}

/* Modal */
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(9,17,29,.56);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:5vh 18px;overflow-y:auto;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:620px;background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;max-height:90vh;border:1px solid rgba(255,255,255,.5);animation:pop .16s ease}
.modal.wide{max-width:960px}
.modal.medium{max-width:760px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:flex-start;gap:12px;padding:17px 18px;border-bottom:1px solid var(--line-2)}
.modal-title-wrap{min-width:0;flex:1}
.modal-eyebrow{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--brand);font-weight:900;margin-bottom:3px}
.modal-title{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em}
.modal-sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.modal-body{padding:18px;overflow-y:auto}
.modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:13px 18px;border-top:1px solid var(--line-2);background:var(--surface-2);border-radius:0 0 16px 16px;flex-wrap:wrap}
.modal-foot .left{margin-right:auto}
.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px 18px}
.detail-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.detail-item span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;margin-bottom:3px}
.detail-item b{display:block;font-size:12.5px;font-weight:700;word-break:break-word}
.detail-amount{font-size:28px;font-weight:850;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.detail-progress{display:grid;gap:5px;margin-top:4px}
.detail-progress .row{justify-content:space-between;font-size:10.5px;color:var(--muted)}
.detail-progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.section-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:900;margin:20px 0 8px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.form-grid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:10.5px;text-transform:uppercase;letter-spacing:.045em;color:var(--ink-2);font-weight:800}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 10px;font-size:12.5px;color:var(--ink);transition:.12s}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:#99d5d0;box-shadow:0 0 0 3px rgba(14,116,144,.1)}
.field textarea{resize:vertical;min-height:70px}
.field .hint{font-size:10px;color:var(--muted)}
.field .error{font-size:10.5px;color:var(--danger);font-weight:700}
.field-label-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mini-link{background:none;border:0;color:var(--brand);font-size:10.5px;font-weight:800;cursor:pointer;padding:0;white-space:nowrap}
.mini-link:hover{text-decoration:underline}
.cat-creator{margin-top:12px;border:1px dashed var(--line);border-radius:10px;padding:0 11px;background:var(--surface-2)}
.cat-creator summary{cursor:pointer;font-size:11px;font-weight:800;color:var(--brand);padding:9px 0;display:flex;align-items:center;gap:6px;list-style:none}
.cat-creator summary::-webkit-details-marker{display:none}
.cat-creator[open] summary{border-bottom:1px solid var(--line-2);margin-bottom:9px}
.cat-creator-grid{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding-bottom:9px}
.cat-creator-grid input,.cat-creator-grid select{height:34px;border:1px solid var(--line);border-radius:8px;padding:0 9px;font-size:12px;background:#fff;min-width:0}
.cat-creator .hint{padding-bottom:9px;margin-top:-3px}
@media(max-width:640px){.cat-creator-grid{grid-template-columns:1fr}}
.form-error{display:none;margin:13px 0 0;padding:9px 11px;background:var(--danger-soft);border:1px solid var(--danger-line);color:var(--danger);border-radius:8px;font-size:11.5px;font-weight:600}
.form-error.show{display:block}
.check{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);font-weight:600}
.check input{width:16px;height:16px;accent-color:var(--brand)}
.inline-note{padding:10px 12px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;font-size:11px;color:var(--muted)}
.inline-note strong{color:var(--ink)}
.code-box{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;word-break:break-all;color:var(--ink-2)}

/* Toast */
.toast-root{position:fixed;right:18px;bottom:18px;z-index:160;display:grid;gap:8px;max-width:min(420px,calc(100vw - 36px))}
.toast{display:flex;align-items:flex-start;gap:9px;background:#101828;color:#fff;border-radius:10px;padding:11px 13px;box-shadow:var(--shadow-lg);font-size:12px;animation:pop .18s ease}
.toast svg{width:16px;height:16px;flex:none;margin-top:1px}
.toast.success svg{color:#6ce9a6}
.toast.error svg{color:#fda29b}
.toast.info svg{color:#84caff}
.toast button{margin-left:auto;background:transparent;border:0;color:#98a2b3;padding:0 2px}

/* Settings */
.settings-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:14px}
.settings-list{display:grid;gap:9px}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:12px}
.settings-row:last-child{border-bottom:0}
.settings-row span{color:var(--muted)}
.settings-row b{font-weight:700;text-align:right;word-break:break-word}
.link-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 11px;border:1px solid var(--line-2);border-radius:9px;margin-bottom:8px;font-size:12px}
.link-row:last-child{margin-bottom:0}
.link-row .lr-main{min-width:0}
.link-row .lr-title{font-weight:700}
.link-row .lr-sub{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:330px}

/* Ingresos, gastos y facturación */
.btn-income{background:linear-gradient(135deg,#1f9d7a,#0e7490);border-color:#0e7490;color:#fff}
.btn-income:hover{filter:brightness(1.05)}
.btn-expense{background:linear-gradient(135deg,#d64545,#9f2d2d);border-color:#9f2d2d;color:#fff}
.btn-expense:hover{filter:brightness(1.05)}
.btn-danger-soft{background:var(--danger-soft);border-color:var(--danger-line);color:var(--danger)}
.btn-danger-soft:hover{background:#fde7e3}
.kpi-grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.quick-strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
.quick-action{display:flex;align-items:center;gap:12px;padding:14px 15px;border-radius:12px;border:1px solid var(--line);background:#fff;text-align:left;transition:.15s;width:100%;box-shadow:var(--shadow-sm)}
.quick-action:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.quick-action .qa-icon{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none}
.quick-action .qa-text{min-width:0;flex:1}
.quick-action .qa-text b{display:block;font-size:13px;letter-spacing:-.01em}
.quick-action .qa-text small{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
.quick-action .qa-plus{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--surface-3);color:var(--muted)}
.quick-action.income .qa-icon{background:var(--success-soft);color:var(--success)}
.quick-action.income{border-color:var(--success-line)}
.quick-action.expense .qa-icon{background:var(--danger-soft);color:var(--danger)}
.quick-action.expense{border-color:var(--danger-line)}
.quick-menu{display:grid;gap:10px}
.quick-form-head{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;margin-bottom:14px;border:1px solid var(--line)}
.quick-form-head .qa-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.quick-form-head b{display:block;font-size:12.5px}
.quick-form-head small{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}
.quick-form-head.income{background:var(--success-soft);border-color:var(--success-line)}
.quick-form-head.income .qa-icon{background:#fff;color:var(--success)}
.quick-form-head.expense{background:var(--danger-soft);border-color:var(--danger-line)}
.quick-form-head.expense .qa-icon{background:#fff;color:var(--danger)}
.fact-hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:0;border-radius:14px;overflow:hidden;margin-bottom:16px;background:linear-gradient(135deg,#0b3b3a,#0e7490 60%,#155e75);color:#eafffb;box-shadow:0 14px 34px rgba(14,116,144,.28)}
.fact-hero-main{padding:22px 24px}
.fact-hero-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:900;opacity:.82}
.fact-hero-value{font-size:34px;font-weight:850;letter-spacing:-.03em;line-height:1.1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.fact-hero-note{font-size:11.5px;opacity:.86}
.fact-hero-side{display:grid;grid-template-rows:1fr 1fr;border-left:1px solid rgba(255,255,255,.18)}
.fact-hero-side>div{padding:14px 18px;display:flex;flex-direction:column;justify-content:center}
.fact-hero-side>div+div{border-top:1px solid rgba(255,255,255,.18)}
.fact-hero-side span{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;font-weight:900;opacity:.75}
.fact-hero-side b{font-size:19px;font-weight:850;font-variant-numeric:tabular-nums;margin-top:2px}
.fact-hero-side small{font-size:10.5px;opacity:.8;margin-top:1px}
.result-hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);border-radius:16px;overflow:hidden;margin-bottom:16px;background:linear-gradient(135deg,#082f2c,#0b4f4a 55%,#0e7490);color:#eafffb;box-shadow:0 16px 38px rgba(8,47,44,.28)}
.result-main{padding:24px 26px;display:flex;flex-direction:column;justify-content:center}
.result-label{font-size:10px;letter-spacing:.17em;text-transform:uppercase;font-weight:900;opacity:.8}
.result-value{font-size:42px;font-weight:900;letter-spacing:-.04em;line-height:1.05;margin:8px 0 6px;font-variant-numeric:tabular-nums}
.result-value.is-pos{color:#a7f3d0}
.result-value.is-neg{color:#fecaca}
.result-formula{font-size:11.5px;opacity:.82}
.result-side{display:grid;grid-template-rows:repeat(3,1fr);border-left:1px solid rgba(255,255,255,.18)}
.result-side>div{padding:13px 18px;display:flex;flex-direction:column;justify-content:center}
.result-side>div+div{border-top:1px solid rgba(255,255,255,.15)}
.result-side span{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;font-weight:900;opacity:.76}
.result-side b{font-size:20px;font-weight:850;font-variant-numeric:tabular-nums;margin-top:2px}
.result-side b.is-neg{color:#fecaca}
.result-side small{font-size:10.5px;opacity:.78;margin-top:1px}
.live-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#e8f8f1;color:#0f6b4f;border:1px solid #b7e6d2;font-size:10.5px;font-weight:800;white-space:nowrap}
.live-pill i{width:7px;height:7px;border-radius:50%;background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.18);display:inline-block}
.alert-banner.danger{border-color:var(--danger-line);background:linear-gradient(135deg,#fff4f2,#fff)}
.alert-banner.danger .alert-icon{background:var(--danger-soft);color:var(--danger)}

/* Responsive */
@media (max-width:1280px){
  .kpi-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid-dash{grid-template-columns:1fr}
  .invest-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1024px){
  .sidebar{transform:translateX(-100%);transition:transform .2s ease;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}
  .main{margin-left:0}
  .mobile-menu{display:grid}
  .topbar{padding:0 16px}
  .content{padding:20px 16px 92px}
  .search-wrap{width:min(430px,46vw)}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(12px);padding:6px 8px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .bottom-item{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--muted);font-size:9.5px;font-weight:700;padding:6px 8px;border-radius:8px;min-width:54px}
  .bottom-item svg{width:19px;height:19px}
  .bottom-item.active{color:var(--brand);background:var(--brand-soft)}
  .settings-grid{grid-template-columns:1fr}
}
@media (max-width:760px){
  .search-wrap{flex:1;width:auto}
  .search-box kbd{display:none}
  .topbar{height:62px;gap:8px}
  .topbar-actions .hide-mobile{display:none}
  .page-title{font-size:22px}
  .page-head{align-items:flex-start}
  .page-actions{width:100%}
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi-grid-4{grid-template-columns:1fr 1fr}
  .quick-strip{grid-template-columns:1fr}
  .fact-hero{grid-template-columns:1fr}
  .fact-hero-value{font-size:26px}
  .fact-hero-side{grid-template-columns:1fr 1fr;grid-template-rows:none;border-left:0;border-top:1px solid rgba(255,255,255,.18)}
  .fact-hero-side>div+div{border-top:0;border-left:1px solid rgba(255,255,255,.18)}
  .result-hero{grid-template-columns:1fr}
  .result-value{font-size:32px}
  .result-side{grid-template-columns:1fr;grid-template-rows:none;border-left:0;border-top:1px solid rgba(255,255,255,.18)}
  .result-side>div+div{border-top:1px solid rgba(255,255,255,.15);border-left:0}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .invest-grid{grid-template-columns:1fr}
  .form-grid,.form-grid.three,.detail-grid,.detail-grid.two{grid-template-columns:1fr}
  .filterbar{padding:9px}
  .filterbar .search-mini{max-width:none}
  .modal-backdrop{padding:10px;align-items:flex-end}
  .modal{max-height:94vh;border-radius:14px}
  .modal-body{padding:14px}
  .modal-foot{padding:12px 14px}
  .modal-head{padding:14px}
  .content{padding:16px 12px 90px}
  .mobile-cards{display:grid;gap:10px}
  .desktop-table{display:none}
  .hist-card{padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .hist-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
  .hist-card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .hist-card-grid span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}
  .hist-card-grid b{display:block;font-size:12px;margin-top:1px;font-variant-numeric:tabular-nums}
  .hist-card-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
}
@media (max-width:480px){
  .kpi-grid{grid-template-columns:1fr 1fr}
  .kpi-value{font-size:17px}
  .page-actions .btn{flex:1}
  .topbar-actions .avatar{display:none}
  .invest-kpis{grid-template-columns:1fr 1fr}
}
@media print{
  .sidebar,.topbar,.bottom-nav,.page-actions,.filterbar,.toast-root,.modal-backdrop{display:none!important}
  .main{margin:0}.content{padding:0}
  body{background:#fff}
}
</style>
</head>
<body>
<a class="skip-link" href="#main">Saltar al contenido</a>
<div id="boot" class="boot-screen">

function jsonEstable_(valor) {
  if (valor === null || typeof valor !== 'object') return JSON.stringify(valor);
  if (Array.isArray(valor)) return '[' + valor.map(jsonEstable_).join(',') + ']';
  return '{' + Object.keys(valor).sort().map(function (k) {
    return JSON.stringify(k) + ':' + jsonEstable_(valor[k]);
  }).join(',') + '}';
}

function mergeResumenRapido(r) {
  if (!r || !r.ok || !state.data) return false;
  const d = state.data;
  const huella = function () {
    return jsonEstable_({
      resumen: d.resumen,
      pagos: d.pagos,
      pagosDetalle: d.pagosDetalle,
      detalle: d.detalle,
      recientes: d.recientes,
      salud: d.salud,
      hoy: d.hoy,
      hoyISO: d.hoyISO,
      periodo: d.periodo
    });
  };
  const antes = huella();
  d.resumen = r.resumen || d.resumen;
  d.pagos = r.pagos || d.pagos;
  d.pagosDetalle = r.pagosDetalle || d.pagosDetalle;
  d.detalle = r.detalle || d.detalle;
  d.recientes = r.recientes || d.recientes;
  d.salud = Object.assign({}, d.salud || {}, r.salud || {});
  d.hoy = r.hoy || d.hoy;
  d.hoyISO = r.hoyISO || d.hoyISO;
  d.periodo = r.periodo || d.periodo;
  if (state.movsRange.preset === 'mes') {
    state.movs = d.detalle || [];
    state.movsPeriodo = d.periodo || state.movsPeriodo;
  }
  return antes !== huella();
}

  if (hayEdicionActiva_(2500)) return;

  }
}

const FACT_SYNC_MS = 180000;
const FACT_BACKOFF_BASE_MS = 15 * 60 * 1000;
const FACT_BACKOFF_MAX_MS = 60 * 60 * 1000;
let factSyncTimer = null;
let factLastSync = 0;
let factLastServerSync = 0;
let factSyncBackoffUntil = 0;
let factBackoffHits = 0;

function factProgramarBackoff_() {
  factBackoffHits = Math.min(factBackoffHits + 1, 5);
  const espera = Math.min(FACT_BACKOFF_MAX_MS, FACT_BACKOFF_BASE_MS * Math.pow(2, factBackoffHits - 1));
  factSyncBackoffUntil = Date.now() + espera;
}

function factLimpiarBackoff_() {
  factBackoffHits = 0;
  factSyncBackoffUntil = 0;
}

function factUsuarioEscribiendo_() {
  return hayEdicionActiva_(3000);
}

/**
 * La app nunca lee Firestore. El servidor sincroniza con un trigger cada
 * 5 minutos y aquí solo se consume el consolidado ya calculado. Así se
 * eliminan los errores 429 y la facturación abre al instante.
 */
async function sincronizarFacturacion(silent, forzar) {
  const ahora = Date.now();
  if (ahora < factSyncBackoffUntil) return false;
  if (state.factSyncing) return false;
  if (silent && !forzar && (ahora - factLastSync < 60000)) return false;
  if (hayEdicionActiva_(silent ? 3000 : 0)) return false;
  state.factSyncing = true;
  state.factError = '';
  if (!state.fact) state.factLoading = true;
  if (state.view === 'facturacion') renderSiLibre_(0);
  const primeraCarga = !state.fact;
  let fresco = false;
  try {
    // 1) Consolidado instantáneo: el servidor lo tiene en caché.
    let actual = null;
    try { actual = await call('appFacturacionResumen', TOKEN, {}); } catch (ignorado) {}
    if (actual && actual.ok && actual.conectado) {
      state.fact = actual;
      if (actual.sincronizado) fresco = true;
    }

    // 2) Solo el servidor habla con Firestore, y como máximo cada 5 minutos.
    //    La primera carga no espera: muestra lo ya consolidado.
    const tocaServidor = forzar || !factLastServerSync || (ahora - factLastServerSync) >= FACT_SYNC_MS;
    if (tocaServidor) {
      try {
        const r = await call('appSincronizarFacturacion', TOKEN, { forzar: !!forzar });
        factLastServerSync = Date.now();
        if (r && r.ok && r.conectado) {
          state.fact = r;
          fresco = true;
          if (r.rateLimit || r.omitido === 'backoff') factProgramarBackoff_();
          else factLimpiarBackoff_();
        } else if (r && r.rateLimit) {
          factProgramarBackoff_();
        }
      } catch (e) {
        factLastServerSync = Date.now();
      }
    }
    if (!state.fact) state.factError = 'sync';
  } finally {
    state.factSyncing = false;
    state.factLoading = false;
    factLastSync = Date.now();
  }
  if (hayEdicionActiva_(0)) {
    state.renderPendiente = true;
    return fresco;
  }
  if (fresco || primeraCarga || !silent) renderSiLibre_(0);
  return fresco;
}

function iniciarSincronizacionFacturacion() {
  if (factSyncTimer) return;
  factSyncTimer = setInterval(function () {
    if (document.visibilityState === 'visible') sincronizarFacturacion(true);
  }, FACT_SYNC_MS);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') sincronizarFacturacion(true);
  });
}

function factPeriodo(clave) {
  const f = state.fact;
  return (f && f.periodos && f.periodos[clave]) || { facturas: 0, ventas: 0, ganancia: 0, ticket: 0, margen: 0, costo: 0 };
}

function factDesglose() {
  const d = state.fact && state.fact.desglose;
  return d || { dias: [], semanas: [], meses: [], anios: [] };
}

function factCortes() {
  return (state.fact && state.fact.cortes) || {};
}

function round2(x) { return Math.round((Number(x) || 0) * 100) / 100; }
function factFilasDesglose(gran, rango) {
  const claveMap = { dia: 'dias', semana: 'semanas', mes: 'meses', anio: 'anios' };
  const granClave = claveMap[gran] || 'dias';
  const filas = factDesglose()[granClave] || [];
  const c = factCortes();
  const hoy = c.hoy || (state.data && state.data.hoyISO) || '';
  const limites = {
    hoy: [hoy, hoy],
    semana: [c.inicioSemana || hoy, hoy],
    mes: [c.inicioMes || '', hoy],
    anio: [c.inicioAnio || '', hoy],
    historico: ['', hoy]
  };
  const lim = limites[rango] || limites.mes;
  return filas.filter(function (f) {
    const ini = f.inicio || f.clave;
    const fin = f.fin || f.clave;
    if (lim[0] && String(fin) < String(lim[0])) return false;
    if (lim[1] && String(ini) > String(lim[1])) return false;
    return true;
  });
}

function factTotalesDesglose(filas) {
  const t = { facturas: 0, ventas: 0, ganancia: 0, costo: 0, unidades: 0, ratio: 0 };
  (filas || []).forEach(function (f) {
    t.facturas += num(f.facturas);
    t.ventas = round2(t.ventas + num(f.ventas));
    t.ganancia = round2(t.ganancia + num(f.ganancia));
    t.costo = round2(t.costo + num(f.costo));
    t.unidades = round2(t.unidades + num(f.unidades));
    t.ratio = round2(t.ratio + num(f.ratio));
  });
  t.ticket = t.facturas ? round2(t.ventas / t.facturas) : 0;
  t.margen = t.ventas ? round2(t.ganancia / t.ventas * 100) : 0;
  t.ratio = t.facturas ? round2(t.ratio / t.facturas) : 0;
  return t;
}

function otrosIngresosControl() {
  const rows = (state.data && state.data.detalle) || [];
  return rows.filter(function (m) {
    return num(m.signo) > 0 && !/^ventas?$/.test(normalizeText(m.categoria).trim());
  }).reduce(function (s, m) { return s + num(m.pagadoMonto); }, 0);
}

function gananciaNetaAbsoluta() {
  const f = state.fact && state.fact.ok && state.fact.conectado ? factPeriodo('mes') : { ganancia: 0 };
  const gastos = (state.data && state.data.resumen && state.data.resumen.gastos) || 0;
  return num(f.ganancia) + otrosIngresosControl() - num(gastos);
}

function movAdvVacio() {
  return { categoria: '', texto: '', min: '', max: '', metodo: '', cuenta: '', tipo: '', desde: '', hasta: '' };
}

function movAdvActivos() {
  const a = state.movAdv || {};
  return Object.keys(a).filter(function (k) { return String(a[k] == null ? '' : a[k]).trim() !== ''; }).length;
}

function movAdvCumple(m) {
  const a = state.movAdv || {};
  if (!m) return false;
  if (a.categoria && normalizeText(m.categoria) !== normalizeText(a.categoria)) return false;
  if (a.metodo && normalizeText(m.metodo) !== normalizeText(a.metodo)) return false;
  if (a.cuenta && normalizeText(m.cuenta).indexOf(normalizeText(a.cuenta)) < 0) return false;
  if (a.tipo && String(m.tipo || '') !== String(a.tipo)) return false;
  if (a.texto) {
    const blob = [m.descripcion, m.observaciones, m.referencia, m.beneficiario, m.categoria,
      m.subcategoria, m.id, m.metodo, m.cuenta, m.tipo, (m.etiquetas || []).join(' ')].join(' ');
    if (!matches(blob, a.texto)) return false;
  }
  const importe = num(m.importe);
  if (a.min !== '' && importe < num(a.min)) return false;
  if (a.max !== '' && importe > num(a.max)) return false;
  const fecha = String(m.fechaISO || '');
  if (a.desde && fecha && fecha < a.desde) return false;
  if (a.hasta && fecha && fecha > a.hasta) return false;
  return true;
}

function rangoFechasPreset(preset) {
  const hoy = new Date();
  const pad = function (n) { return String(n).padStart(2, '0'); };
  const iso = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  if (preset === 'hoy') return { desde: iso(hoy), hasta: iso(hoy) };
  if (preset === 'semana') {
    const ini = new Date(hoy.getTime());
    ini.setDate(ini.getDate() - ((ini.getDay() + 6) % 7));
    return { desde: iso(ini), hasta: iso(hoy) };
  }
  if (preset === 'anio') return { desde: hoy.getFullYear() + '-01-01', hasta: hoy.getFullYear() + '-12-31' };
  if (preset === 'personalizado') return { desde: state.movsRange.desde, hasta: state.movsRange.hasta };
  const ini = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
  const fin = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0);
  return { desde: iso(ini), hasta: iso(fin) };
}

async function generarInformeNaturaleza(kind) {
  const tipo = String(kind).toUpperCase() === 'INGRESO' ? 'INGRESOS' : 'GASTOS';
  const r = state.movsRange || { preset: 'mes', desde: '', hasta: '' };
  const rango = rangoFechasPreset(r.preset || 'mes');
  const o = { tipo: tipo };
  if (rango.desde && rango.hasta) { o.desde = rango.desde; o.hasta = rango.hasta; }
  await generarInforme(o);
}

function fechaHoraTexto(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

function ajustarResumenLocal(naturaleza, importe, factor) {
  const d = state.data;
  if (!d) return;
  const r = Object.assign({}, d.resumen || {});
  const monto = num(importe) * (factor || 1);
  const esIngreso = normalizeText(naturaleza).indexOf('ingreso') === 0;
  const esGasto = normalizeText(naturaleza).indexOf('gasto') === 0;
  if (esIngreso) {
    r.ingresos = num(r.ingresos) + monto;
    r.flujoEntradas = num(r.flujoEntradas) + monto;
  } else if (esGasto) {
    r.gastos = num(r.gastos) + monto;
    r.flujoSalidas = num(r.flujoSalidas) + monto;
  }
  r.resultado = num(r.resultado) + (esIngreso ? monto : (esGasto ? -monto : 0));
  r.flujoNeto = num(r.flujoNeto) + (esIngreso ? monto : (esGasto ? -monto : 0));
  r.movimientos = Math.max(0, num(r.movimientos) + (factor > 0 ? 1 : -1));
  d.resumen = r;
  const s = Object.assign({}, d.salud || {});
  s.movimientos = Math.max(0, num(s.movimientos) + (factor > 0 ? 1 : -1));
  d.salud = s;
}

function insertarOptimista(m) {
  const d = state.data;
  if (!d) return;
  d.detalle = [m].concat(d.detalle || []);
  d.recientes = [m].concat(d.recientes || []).slice(0, 15);
  if (state.movs) state.movs = [m].concat(state.movs);
  ajustarResumenLocal(m.naturaleza, m.pagadoMonto, 1);
}

function reemplazarOptimista(tempId, real) {
  if (!real) return;
  const cambiar = function (list) {
    return (list || []).map(function (x) { return String(x.id) === String(tempId) ? real : x; });
  };
  const d = state.data;
  if (!d) return;
  d.detalle = cambiar(d.detalle);
  d.recientes = cambiar(d.recientes);
  if (state.movs) state.movs = cambiar(state.movs);
}

function quitarOptimista(tempId) {
  const filtrar = function (list) {
    return (list || []).filter(function (x) { return String(x.id) !== String(tempId); });
  };
  const d = state.data;
  if (!d) return;
  d.detalle = filtrar(d.detalle);
  d.recientes = filtrar(d.recientes);
  if (state.movs) state.movs = filtrar(state.movs);
}

function reemplazarLoteOptimista(tempIds, reales) {
  const lista = reales || [];
  const mapa = {};
  (tempIds || []).forEach(function (id, i) { if (lista[i]) mapa[String(id)] = lista[i]; });
  const cambiar = function (list) {
    const vistos = {};
    const salida = [];
    (list || []).forEach(function (x) {
      const real = mapa[String(x.id)];
      if (real) {
        const clave = String(real.id);
        if (vistos[clave]) return;
        vistos[clave] = true;
        salida.push(real);
      } else if (!mapa[String(x.id)]) salida.push(x);
    });
    return salida;
  };
  const d = state.data;
  if (!d) return;
  d.detalle = cambiar(d.detalle);
  d.recientes = cambiar(d.recientes).slice(0, 15);
  if (state.movs) state.movs = cambiar(state.movs);
}

function aplicarMovimientoLocal(m) {
  if (!m || !m.id) return;
  const cambiar = function (list) {
    let encontrado = false;
    const salida = (list || []).map(function (x) {
      if (String(x.id) === String(m.id)) { encontrado = true; return Object.assign({}, x, m); }
      return x;
    });
    return encontrado ? salida : null;
  };
  const d = state.data;
  if (!d) return;
  const detalle = cambiar(d.detalle);
  if (detalle) d.detalle = detalle;
  const recientes = cambiar(d.recientes);
  if (recientes) d.recientes = recientes;
  if (state.movs) {
    const movs = cambiar(state.movs);
    if (movs) state.movs = movs;
  }
}

function fechaCortaLocal(iso) {
  const s = String(iso || '').slice(0, 10);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  return s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4);
}

function movimientoOptimistaDesdePayload(d, tempId) {
  const tipos = stateData().tiposMeta || {};
  const meta = tipos[d.Tipo] || {};
  const importe = num(d.Importe);
  const estado = d.Estado || 'Confirmado';
  const pagado = estado === 'Parcial' ? Math.min(importe, num(d.Monto_Pagado)) : (estado === 'Pendiente' ? 0 : importe);
  return {
    id: tempId,
    fecha: fechaCortaLocal(d.Fecha),
    fechaISO: d.Fecha || hoyISO(),

    cuenta: d.Cuenta_Origen || d.Cuenta_Destino || '',
    cuentaDestino: d.Cuenta_Destino || '',

}


const eliminandoMovimientos = {};

/**
 * Reintenta una llamada cuando el servidor responde que está ocupado.
 * Los errores reales se propagan de inmediato.
 */
async function callConReintento(nombre) {
  const args = Array.prototype.slice.call(arguments, 1);
  let ultimo = null;
  for (let intento = 0; intento < 3; intento++) {
    try {
      return await call.apply(null, [nombre].concat(args));
    } catch (e) {
      ultimo = e;
      const msg = String((e && e.message) || e || '');
      if (!/ocupad|intenta de nuevo|try again|lock|espera/i.test(msg)) throw e;
      await new Promise(function (res) { setTimeout(res, 350 * (intento + 1)); });
    }
  }
  throw ultimo;
}

async function guardarCapturaRapida(form) {
  const d = formValues(form);
  const ctx = state.formContext || {};
  const esIngreso = ctx.tipo === 'INGRESO';
  const monto = num(d.importe);
  const copias = Math.max(1, Math.min(500, Math.floor(Number(d.copias) || 1)));
  if (!d.categoria) throw new Error('Selecciona la categoría.');
  if (!(monto > 0)) throw new Error('Escribe un monto mayor que cero.');
  const sello = Date.now();
  const tempIds = [];
  const base = {
    fecha: (state.data && state.data.hoy) || '',
    fechaISO: (state.data && state.data.hoyISO) || localISO(),
    tipo: d.tipo,
    naturaleza: esIngreso ? 'INGRESO_OPERATIVO' : 'GASTO_OPERATIVO',
    categoria: d.categoria,
    subcategoria: '',
    descripcion: d.comentario || d.categoria,
    beneficiario: '',
    importe: monto,
    pagadoMonto: monto,
    saldoMonto: 0,
    metodo: d.metodo,
    cuenta: '',
    estado: 'Confirmado',
    contable: true,
    signo: esIngreso ? 1 : -1,
    signoFlujo: esIngreso ? 1 : -1,
    prioridad: 'Normal',
    etiquetas: [],
    referencia: '',
    optimista: true
  };
  for (let i = 0; i < copias; i++) {
    const tempId = 'temp-' + sello + '-' + i;
    tempIds.push(tempId);
    insertarOptimista(Object.assign({}, base, { id: tempId }));
  }
  closeModal();
  render();
  notify(copias > 1
    ? 'Guardando ' + copias + ' registros de ' + money(monto) + '…'
    : 'Guardando ' + (esIngreso ? 'ingreso' : 'gasto') + ' de ' + money(monto) + '…', 'info');
  try {
    const payload = { tipo: d.tipo, categoria: d.categoria, importe: monto, comentario: d.comentario, metodo: d.metodo };
    if (copias > 1) payload.copias = copias;
    const r = await callConReintento('appCrearMovimientoRapido', TOKEN, payload);
    const reales = (r && r.movimientos && r.movimientos.length) ? r.movimientos : ((r && r.movimiento) ? [r.movimiento] : []);
    reemplazarLoteOptimista(tempIds, reales);
    render();
    notify(copias > 1
      ? copias + ' ' + (esIngreso ? 'ingresos' : 'gastos') + ' de ' + money(monto) + ' registrados.'
      : (esIngreso ? 'Ingreso' : 'Gasto') + ' registrado por ' + money(monto) + '.', 'success');
    if (r && r.categorias) refrescarCatalogosLocales(r.categorias);
  } catch (err) {
    tempIds.forEach(function (tempId) {
      quitarOptimista(tempId);
      ajustarResumenLocal(base.naturaleza, base.pagadoMonto, -1);
    });
    render();
    notify(errMsg(err), 'error');
  } finally {
  }
}

async function eliminarRapidoUI(id, descripcion) {
  if (!id || String(id).indexOf('temp-') === 0) return;
  if (eliminandoMovimientos[String(id)]) return;
  const d = state.data || {};
  const m = byId(d.detalle, id) || byId(d.recientes, id) || byId(state.movs, id);
  if (!m) { notify('No se encontró el movimiento en la vista actual.', 'error'); return; }
  eliminandoMovimientos[String(id)] = true;
  quitarOptimista(id);
  ajustarResumenLocal(m.naturaleza, m.pagadoMonto, -1);
  render();
  notify('Eliminando ' + (descripcion || m.descripcion || 'movimiento') + '…', 'info');
  try {
    await callConReintento('appEliminarMovimientoRapido', TOKEN, id, 'Eliminado desde captura rápida');
    notify('Movimiento eliminado. La operación quedó auditada.', 'success');
  } catch (err) {
    insertarOptimista(m);
    render();
    notify('No se pudo eliminar. El movimiento se restauró. ' + errMsg(err), 'error');
  } finally {
    delete eliminandoMovimientos[String(id)];
  }
}

async function refrescarFacturacionUI() {
  const fresco = await sincronizarFacturacion(false, true);
  if (fresco && state.fact && state.fact.ok && state.fact.sincronizado) {
    notify('Facturación actualizada.', 'success');

  } else if (state.fact) {
    notify('Mostrando los últimos datos guardados. La sincronización se reintentará automáticamente.', 'info');
  }
}

function movMatchesSection(m, section) {
  if (section === 'pendientes') return m.estado === 'Pendiente' || (m.estado === 'Parcial' && num(m.saldoMonto) > 0.009);
  if (section === 'parciales') return m.estado === 'Parcial';
  if (!m.contable) return false;
  if (section === 'ingresos') return num(m.signo) > 0;
  if (section === 'gastos') return num(m.signo) < 0;
  if (section === 'inversiones') return String(m.naturaleza).toUpperCase() === 'INVERSION';
  return true;
}

function movFiltered() {
  const rows = state.movs || [];
  return rows.filter(function (m) {
    if (state.movFilter !== 'todo' && !movMatchesSection(m, state.movFilter)) return false;
    if (state.movStatus !== 'todos' && String(m.estado) !== state.movStatus) return false;
    if (state.movSearch) {
      const blob = [m.descripcion, m.observaciones, m.categoria, m.subcategoria, m.tipo, m.beneficiario, m.referencia, m.id, m.metodo, m.cuenta, (m.etiquetas || []).join(' ')].join(' ');
      if (!matches(blob, state.movSearch)) return false;
    }
    return movAdvCumple(m);
  });
}

function movContent() {
  if (state.movsLoading) {
    return '<section class="panel"><div class="panel-body"><div class="skeleton" style="height:50px;margin-bottom:10px"></div><div class="skeleton" style="height:50px;margin-bottom:10px"></div><div class="skeleton" style="height:50px"></div></div></section>';
  }
  const rows = movFiltered();
  const totalPagado = sum(rows, 'pagadoMonto');
  const totalSaldo = sum(rows, 'saldoMonto');
  const totalImporte = sum(rows, 'importe');
  const conFiltros = state.movFilter !== 'todo' || state.movStatus !== 'todos' || !!state.movSearch || movAdvActivos() > 0;
  return '<section class="panel"><div class="panel-head"><div><h3 class="panel-title">' + rows.length + ' movimiento(s)</h3><div class="panel-sub">Importe ' + money(totalImporte) + ' · efectivo ' + money(totalPagado) + ' · pendiente ' + money(totalSaldo) + '</div></div><div class="row"><span class="table-note">' + (state.movs && state.movs.length || 0) + ' en el periodo</span></div></div>' +
    '<div class="panel-body" style="padding:0">' + (rows.length ? movTable(rows) : '<div style="padding:20px">' + (conFiltros ? emptyState('filter', 'Sin movimientos para los filtros', 'Ajusta la sección, el estado, el importe o limpia los filtros avanzados.', '<button type="button" class="btn btn-soft btn-sm" data-action="reset-mov-adv">Limpiar filtros</button>') : emptyState('list', 'Sin movimientos en el periodo', 'Cambia el periodo o registra un movimiento nuevo.', '<button type="button" class="btn btn-soft btn-sm" data-action="open-form" data-kind="movimiento">Registrar movimiento</button>')) + '</div>') + '</div>' +
    '<div class="panel-foot"><span>El importe efectivo usa <b>Monto_Pagado</b>; el saldo usa <b>Saldo_Pendiente</b>.</span><span>' + esc(state.movsPeriodo || '') + '</span></div></section>';
}

function movTable(rows) {
  return '<div class="table-wrap" style="border:0;border-radius:0"><table class="data"><thead><tr><th>Fecha</th><th>Movimiento</th><th>Categoría</th><th>Estado</th><th>Prioridad</th><th class="num">Importe</th><th class="num">Pagado</th><th class="num">Saldo</th><th></th></tr></thead><tbody>' +
    rows.map(function (m) {
      const tone = m.signo > 0 ? 'money-pos' : m.signo < 0 ? 'money-neg' : '';
      return '<tr class="' + (m.optimista ? 'row-optimista' : '') + '"><td class="nowrap">' + esc(m.fecha) + '<div class="sub-cell">' + esc(m.id) + '</div></td>' +
        '<td><div class="main-cell">' + esc(m.descripcion) + '</div><div class="sub-cell">' + esc(m.tipo) + (m.beneficiario ? ' · ' + esc(m.beneficiario) : '') + (m.parcial ? ' · ' + (m.etiquetas || []).join(', ') : '') + '</div></td>' +
        '<td>' + esc(m.categoria) + '<div class="sub-cell">' + esc(m.subcategoria || '') + '</div></td>' +
        '<td>' + statusPill(m.estado) + (m.vence ? '<div class="sub-cell">Vence ' + esc(m.vence) + '</div>' : '') + '</td>' +
        '<td>' + priorityLabel(m.prioridad) + '</td>' +
        '<td class="num ' + tone + '">' + money(m.importe) + '</td><td class="num">' + money(m.pagadoMonto) + '</td><td class="num ' + (num(m.saldoMonto) > 0 ? 'money-neg' : '') + '">' + money(m.saldoMonto) + '</td>' +
        '<td class="actions"><div class="row" style="justify-content:flex-end;gap:2px">' +
        (m.optimista ? '<span class="row-pending"><span class="spin"></span> Guardando</span>' :
          '<button type="button" class="icon-btn" data-action="open-mov" data-id="' + esc(m.id) + '" title="Ver detalle" aria-label="Ver ' + esc(m.descripcion) + '">' + icon('eye', 14) + '</button>' +
          '<button type="button" class="icon-btn" data-action="edit-mov" data-id="' + esc(m.id) + '" title="Editar" aria-label="Editar ' + esc(m.descripcion) + '">' + icon('edit', 14) + '</button>') +

    }).join('') + '</tbody></table></div>';
}

async function loadMovements(preset, desde, hasta) {
  const target = preset || state.movsRange.preset;
  if (target === 'personalizado' && (!desde || !hasta)) {
    notify('Selecciona las fechas desde y hasta.', 'error');
    return;
  }
  state.movsRange = { preset: target, desde: desde || state.movsRange.desde, hasta: hasta || state.movsRange.hasta };
  state.movsLoading = true;
  render();
  try {
    const r = await call('appReporte', TOKEN, { preset: target, desde: state.movsRange.desde, hasta: state.movsRange.hasta, seccion: 'todo' });
    state.movs = r.detalle || [];
    state.movsPeriodo = (r.periodo && r.periodo.etiqueta) || '';
    state.movsLoading = false;
    render();
  } catch (err) {
    state.movsLoading = false;
    render();
    notify(errMsg(err), 'error');
  }
}

function frecuenciaTexto(e) {
  const f = (e && e.frecuencia) || 'Única';
  if (f === 'Cada X horas') return 'Cada ' + ((e && e.cadaHoras) || 1) + ' hora(s)';
  if (f === 'Cada X días') return 'Cada ' + ((e && e.cadaDias) || 1) + ' día(s)';
  return f;
}

function recordatorioForm() {
  return '<form id="form-recordatorio" data-form="recordatorio"><div class="form-grid">' +
    fieldInput('Titulo', 'Título', '', { full: true, required: true, placeholder: 'Ej. Pagar la luz, revisar caja, enviar reporte…' }) +
    fieldInput('Fecha', 'Día de inicio', hoyISO(), { type: 'date', required: true }) +
    fieldInput('Hora', 'Hora', '09:00', { type: 'time', required: true }) +
    fieldSelect('Frecuencia', 'Frecuencia', RECORD_FREQS, 'Mensual', { required: true }) +
    fieldInput('Cada_Dias', 'Cada X días', 1, { type: 'number', min: '1', max: '365', hint: 'Solo para «Cada X días».' }) +
    fieldInput('Cada_Horas', 'Cada X horas', 1, { type: 'number', min: '1', max: '168', hint: 'Solo para «Cada X horas».' }) +

function recordatorioTabla(eventos) {
  if (!eventos.length) return '<div style="padding:20px">' + emptyState('bell', 'Sin notificaciones registradas', 'Usa el formulario de arriba para crear la primera.') + '</div>';
  return '<div class="table-wrap" style="border:0;border-radius:0"><table class="data"><thead><tr><th>Próximo envío</th><th>Notificación</th><th>Frecuencia</th><th>Mensaje</th><th>Estado</th><th></th></tr></thead><tbody>' +
    eventos.map(function (e) {
      return '<tr><td class="nowrap"><div class="main-cell">' + esc(e.proximo || e.fecha || '—') + '</div>' + (e.ultimoEnvio ? '<div class="sub-cell">Último: ' + esc(e.ultimoEnvio) + '</div>' : '') + '</td>' +
        '<td><div class="main-cell">' + esc(e.titulo) + '</div><div class="sub-cell">' + esc(e.hora || '09:00') + ' · ' + esc(e.id) + '</div></td>' +
        '<td>' + esc(frecuenciaTexto(e)) + '</td>' +
        '<td class="muted" style="max-width:280px">' + esc(e.mensaje || e.notas || '—') + '</td>' +
        '<td>' + statusPill(e.estado || 'Activo') + '</td>' +
        '<td class="nowrap"><button type="button" class="icon-btn" data-action="edit-evento" data-id="' + esc(e.id) + '" title="Editar" aria-label="Editar ' + esc(e.titulo) + '">' + icon('edit', 14) + '</button>' +
        '<button type="button" class="icon-btn danger" data-action="evento-cancel" data-id="' + esc(e.id) + '" title="Cancelar" aria-label="Cancelar ' + esc(e.titulo) + '">' + icon('trash', 14) + '</button></td></tr>';
    }).join('') + '</tbody></table></div>';
}

function notificationRow(n) {
  const isProgramada = n.estado === 'Programada';
  return '<div class="dash-row"><span class="dr-icon">' + icon(n.canal === 'Navegador' ? 'bell' : 'info', 14) + '</span><div class="dr-main"><div class="dr-title">' + esc(n.asunto) + '</div><div class="dr-sub">' + esc(n.programada || '') + ' · ' + esc(n.tipo) + ' · ' + esc(n.canal) + '</div></div>' +

    '<button type="button" class="icon-btn danger" data-action="notif-cancel" data-id="' + esc(n.id) + '" title="Cancelar aviso" aria-label="Cancelar aviso">' + icon('close', 14) + '</button></div></div>';
}

async function marcarNotificacion(id, estado) {
  try {
    const r = await call('appMarcarNotificacion', TOKEN, id, estado);
    if (r.data) applyData(r.data);
    render();
    notify(estado === 'Entregada' ? 'Aviso marcado como entregado.' : 'Aviso cancelado.', 'success');
  } catch (err) { notify(errMsg(err), 'error'); }
}

async function programarNotificaciones() {
  try {
    notify('Programando avisos…', 'info');
    const r = await call('appProgramarNotificaciones', TOKEN);
    if (r.data) applyData(r.data);
    render();
    const x = r.resultado || {};
    notify('Avisos programados: ' + (x.creadas || 0) + ' nuevo(s), ' + (x.existentes || 0) + ' existente(s).', 'success');
  } catch (err) { notify(errMsg(err), 'error'); }
}

async function procesarColaNotificaciones() {
  try {
    const r = await call('appProcesarCola', TOKEN);
    if (r.data) applyData(r.data);
    render();
    const x = r.resultado || {};
    notify('Cola procesada: ' + (x.enviadas || 0) + ' enviada(s), ' + (x.reintentos || 0) + ' reintento(s), ' + (x.fallidas || 0) + ' fallida(s).', x.fallidas ? 'error' : 'success');
  } catch (err) { notify(errMsg(err), 'error'); }
}

async function probarAvisos() {
  try {
    notify('Enviando correo de prueba…', 'info');
    const r = await call('appProbarAvisos', TOKEN);
    notify('Correo de prueba enviado a ' + (r.destinatarios || []).join(', ') + '.', 'success');
  } catch (err) { notify(errMsg(err), 'error'); }
}

function pedirPermisoNotificaciones() {
  if (typeof Notification === 'undefined') {
    notify('Este navegador no admite notificaciones.', 'error');
    return;
  }
  Notification.requestPermission().then(function (permission) {
    if (permission === 'granted') {
      new Notification('CONTROL · Notificaciones activas', { body: 'Recibirás avisos mientras la aplicación esté abierta.' });
      notify('Notificaciones del navegador activadas.', 'success');
    } else {
      notify('No se concedió permiso de notificaciones.', 'error');
    }
    render();
  }).catch(function (err) { notify(errMsg(err), 'error'); });
}

function reportBuilder() {
  const t = state.reportTipo;
  const needsMonth = ['MENSUAL', 'PRESUPUESTOS', 'GASTOS', 'INGRESOS', 'ABSOLUTO'].indexOf(t) >= 0;
  const needsYear = t === 'ANUAL';
  const needsRange = t === 'MOVIMIENTOS';
  return '<section class="panel"><div class="panel-head"><div><h3 class="panel-title">Construir informe</h3><div class="panel-sub">Selecciona el tipo y el periodo</div></div><span class="pill pill-success">Solo PDF</span></div><div class="panel-body">' +
    '<div class="form-grid">' +
    '<div class="field full"><label for="report-tipo">Tipo de informe</label><select id="report-tipo" data-change="report-tipo">' +
    REPORT_TYPES.map(function (x) { return '<option value="' + x[0] + '"' + (t === x[0] ? ' selected' : '') + '>' + x[1] + '</option>'; }).join('') + '</select>' +
    '<div class="hint">' + esc(reportDescription(t)) + '</div></div>' +
    (needsMonth ? '<div class="field full"><label for="report-periodo">Periodo mensual</label><input id="report-periodo" type="month" value="' + esc(state.reportPeriodo) + '" data-change="report-periodo"></div>' : '') +
    (needsYear ? '<div class="field full"><label for="report-anio">Año</label><input id="report-anio" type="number" min="2026" max="2100" step="1" value="' + esc(state.reportAnio) + '" data-change="report-anio"></div>' : '') +
    (needsRange ? '<div class="field"><label for="report-desde">Desde</label><input id="report-desde" type="date" value="' + esc(state.reportDesde) + '" data-change="report-desde"></div><div class="field"><label for="report-hasta">Hasta</label><input id="report-hasta" type="date" value="' + esc(state.reportHasta) + '" data-change="report-hasta"></div>' : '') +
    (!needsMonth && !needsYear && !needsRange ? '<div class="field full"><div class="inline-note"><strong>Sin filtro de periodo:</strong> este informe consolida la información disponible al momento de generarlo.</div></div>' : '') +
    '</div>' +
    '<div class="divider"></div>' +
    '<button type="button" class="btn btn-primary" data-action="report-generate" style="width:100%;text-transform:uppercase;letter-spacing:.04em">' + icon('download') + ' DESCARGAR INFORME PDF</button>' +
    '<div class="inline-note" style="margin-top:12px">El PDF se genera en Google Drive y se descarga desde la app. Incluye secciones, subtotales y el detalle de cada registro. Si supera 8 MB, se abre el enlace del documento. No se generan archivos CSV.</div>' +
    '</div></section>';
}

function reportDescription(tipo) {
  const d = {
    ABSOLUTO: 'Ventas y ganancia de facturación, otros ingresos, gastos operativos y ganancia neta absoluta del periodo.',
    GASTOS: 'Todos los gastos del mes con detalle individual, resumen por categoría y subtotales.',
    INGRESOS: 'Todos los ingresos del mes con detalle individual, resumen por categoría y subtotales.',
    FACTURACION: 'Ventas y ganancia realizada desde facturación en solo lectura, con conciliación y últimas facturas.',
    MENSUAL: 'Resumen ejecutivo, KPIs, presupuesto, inversiones y movimientos del mes seleccionado.',
    ANUAL: 'Consolidado del año con comparativo mensual, presupuesto y detalle de movimientos.',
    HISTORICO: 'Todos los periodos desde octubre de 2026, con resumen anual y detalle histórico.',
    MOVIMIENTOS: 'Listado filtrado por rango de fechas, con totales y clasificación.',
    PRESUPUESTOS: 'Partidas del periodo, ejecución, disponibilidad y alertas.',
    INVERSIONES: 'Capital, valor actual, recuperaciones, rendimiento realizado y no realizado.',
    POR_PAGAR: 'Compromisos activos, saldos, vencimientos y situación de cada obligación.'
  };
  return d[tipo] || '';
}

function reportPayload() {
  const tipo = state.reportTipo;
  const out = { tipo: tipo };
  if (['MENSUAL', 'PRESUPUESTOS', 'GASTOS', 'INGRESOS', 'ABSOLUTO'].indexOf(tipo) >= 0) out.periodo = state.reportPeriodo;
  if (tipo === 'ANUAL') out.periodo = state.reportAnio;
  if (tipo === 'MOVIMIENTOS') { out.desde = state.reportDesde; out.hasta = state.reportHasta; }
  return out;
}

async function generarInforme(opciones) {
  const o = opciones || reportPayload();
  try {
    const btn = document.querySelector('[data-action="report-generate"]');
    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Generando PDF…'; }
    notify('Generando informe PDF en Google Drive…', 'info');
    const r = await call('appGenerarInforme', TOKEN, o);
    const url = safeUrl(r.url || (r.informe && r.informe.URL));
    if (url) {
      // El PDF ya está en Drive: se abre sin transferir megabytes por el puente.
      try { window.open(url, '_blank', 'noopener'); } catch (e) {}
      notify('PDF listo' + (r.idempotente ? ' (documento vigente reutilizado).' : '.') + ' Si no se abrió, usa el enlace.', 'success', url);
    } else if (r.base64) {
      downloadBase64(r.nombre, r.base64, r.mime || 'application/pdf');
      notify('PDF generado y descargado' + (r.idempotente ? ' (documento vigente reutilizado).' : '.'), 'success');
    } else {
      notify('Informe generado, pero no se recibió el enlace del archivo.', 'error');
    }
    refreshData(true);

async function descargarInforme(id) {
  try {

    if (r.base64) {
      downloadBase64(r.nombre, r.base64, r.mime || 'application/pdf');
      notify('Descarga iniciada.', 'success');
    } else if (r.url || (r.informe && (r.informe.URL || r.informe.url))) {
      const url = r.url || r.informe.URL || r.informe.url;
      window.open(url, '_blank', 'noopener');
      notify('Se abrió el documento en Drive.', 'info');
    } else {
      throw new Error('El archivo no está disponible para descarga directa.');
    }
  } catch (err) { notify(errMsg(err), 'error'); }
}

function formatBytes(bytes) {
  const b = num(bytes);
  if (!b) return '—';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}

function openModal(config) {
  if (!state.modal) state.modalReturnFocus = document.activeElement;
  state.modal = Object.assign({ size: 'medium' }, config || {});
  renderModal();
  document.body.classList.add('modal-open');
  setTimeout(function () {
    const root = document.getElementById('modal-root');
    if (!root) return;
    const target = root.querySelector('[data-autofocus]') || root.querySelector('.modal-body input:not([type="hidden"]), .modal-body select, .modal-body textarea') || root.querySelector('.modal-foot .btn');
    if (target) target.focus();
  }, 40);
}

function closeModal() {
  state.modal = null;
  renderModal();
  document.body.classList.remove('modal-open');
  const back = state.modalReturnFocus;
  state.modalReturnFocus = null;
  if (back && typeof back.focus === 'function') setTimeout(function () { try { back.focus(); } catch (e) {} }, 20);
  programarFlushRender_();
}

function renderModal() {
  const root = document.getElementById('modal-root');
  if (!root) return;
  const m = state.modal;
  if (!m) { root.innerHTML = ''; return; }
  const size = m.size === 'wide' ? ' wide' : m.size === 'small' ? ' small' : '';
  const closable = m.closable !== false && !m.busy;
  root.innerHTML = '<div class="modal-backdrop" data-modal-backdrop><div class="modal' + size + '" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
    '<div class="modal-head"><div class="modal-title-wrap">' +
    (m.eyebrow ? '<div class="modal-eyebrow">' + esc(m.eyebrow) + '</div>' : '') +
    '<h2 class="modal-title" id="modal-title">' + esc(m.title || 'Detalle') + '</h2>' +
    (m.subtitle ? '<div class="modal-sub">' + m.subtitle + '</div>' : '') +
    '</div>' + (closable ? '<button type="button" class="icon-btn" data-action="modal-close" aria-label="Cerrar">' + icon('close', 18) + '</button>' : '') + '</div>' +
    '<div class="modal-body">' + (m.body || '') + '</div>' +
    (m.footer ? '<div class="modal-foot">' + m.footer + '</div>' : '') +
    '</div></div>';
}
