  const vistos = {};
  (values || []).forEach(function (v) {
    const s = String(v == null ? '' : v).trim();
    if (!s) return;
    const k = normalizeText(s);
    if (vistos[k]) return;
    vistos[k] = true;
    out.push(s);
  });
  return out;
}

function opcionesCategoria_(values, selected) {
  const actual = String(valor(selected) || '').trim();
  const items = categoriasUnicas_(values);
  if (actual && !items.some(function (v) { return normalizeText(v) === normalizeText(actual); })) items.push(actual);
  return '<option value="">Selecciona una categoría…</option>' +
    items.map(function (v) {
      return '<option value="' + esc(v) + '"' + (normalizeText(v) === normalizeText(actual) ? ' selected' : '') + '>' + esc(v) + '</option>';
    }).join('') +
    '<option value="__nueva__">+ Nueva categoría…</option>';
}

function fieldCategory(name, label, values, selected, opts) {
  const o = opts || {};
  const actual = String(valor(selected) || '').trim();
  return '<div class="field field-cat ' + (o.full ? 'full' : '') + '">' +
    '<div class="field-label-row"><label for="f-' + esc(name) + '">' + esc(label) + (o.required ? ' *' : '') + '</label>' +
    '<button type="button" class="mini-link" data-action="focus-cat-creator">+ Nueva</button></div>' +
    '<select id="f-' + esc(name) + '" name="' + esc(name) + '" data-cat-select data-cat-prev="' + esc(actual) + '"' +
    (o.required ? ' required' : '') + (o.extra || '') + '>' +
    opcionesCategoria_(values, actual) +
    '</select>' +
    (o.hint ? '<div class="hint">' + esc(o.hint) + '</div>' : '') +
    '</div>';
}

function categoryCreator(kind, targetId) {
  const k = String(kind || '').toUpperCase();
  const grupo = k.indexOf('INGRESO') >= 0 ? 'Ingreso' : k.indexOf('INVERSION') >= 0 ? 'Inversión' : 'Gasto';
  return '<details class="cat-creator">' +
    '<summary>' + icon('plus', 13) + ' Crear categoría nueva</summary>' +
    '<div class="cat-creator-grid">' +
    '<input id="cat-new-name" type="text" maxlength="80" placeholder="Nombre de la categoría" aria-label="Nombre de la nueva categoría">' +
    '<select id="cat-new-group" aria-label="Grupo de la categoría">' +
    ['Ingreso', 'Gasto', 'Inversión'].map(function (g) { return '<option value="' + g + '"' + (g === grupo ? ' selected' : '') + '>' + g + '</option>'; }).join('') +
    '</select>' +
    '<button type="button" class="btn btn-sm btn-soft" data-action="create-category" data-target="' + esc(targetId || 'f-categoria') + '">' + icon('plus', 13) + ' Crear</button>' +
    '</div><div class="hint">Se guarda en el catálogo y queda seleccionada al instante. Si ya existe, se reutiliza.</div></details>';
}

function refrescarCatalogosLocales(categorias, detalleCompleto) {
  const d = state.data;
  if (!d || !d.catalogos || !categorias || !categorias.length) return;
  d.catalogos.categorias = categorias.slice();
  let detalle;
  if (Array.isArray(detalleCompleto) && detalleCompleto.length) {
    detalle = detalleCompleto.slice();
  } else {
    detalle = (d.catalogos.categoriasDetalle || []).slice();
    const vistos = {};
    detalle.forEach(function (c) { vistos[normalizeText(c.categoria)] = true; });
    categorias.forEach(function (nombre) {
      if (!vistos[normalizeText(nombre)]) detalle.push({ categoria: nombre, grupo: '', color: '', orden: 999 });
    });
  }
  d.catalogos.categoriasDetalle = detalle;
}

function enfocarCreadorCategoria(el) {
  const contenedor = el ? el.closest('.field-cat') : null;
  const form = el ? el.closest('form') : null;
  const details = (contenedor && contenedor.parentNode ? contenedor.parentNode.querySelector('.cat-creator') : null) || (form ? form.querySelector('.cat-creator') : null);
  if (!details) { notify('No se encontró el creador de categorías en este formulario.', 'error'); return; }
  details.open = true;
  const input = details.querySelector('#cat-new-name');
  if (input) { input.focus(); input.select(); }
  try { details.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {}
}

async function crearCategoriaUI(el) {
  const form = el ? el.closest('form') : null;
  const details = el ? el.closest('.cat-creator') : null;
  const nameEl = (details && details.querySelector('#cat-new-name')) || (form && form.querySelector('#cat-new-name'));
  const groupEl = (details && details.querySelector('#cat-new-group')) || (form && form.querySelector('#cat-new-group'));
  const nombre = nameEl ? String(nameEl.value || '').trim() : '';
  if (!nombre) {
    notify('Escribe el nombre de la categoría.', 'error');
    if (nameEl) nameEl.focus();
    return;
  }
  if (el) el.disabled = true;
  try {
    const r = await callConReintento('appCrearCategoria', TOKEN, {
      categoria: nombre,
      grupo: groupEl ? groupEl.value : ''
    });
    const cat = r.catalogos || {};
    refrescarCatalogosLocales(r.categorias || cat.categorias || [], cat.categoriasDetalle || []);
    const target = document.getElementById(el.dataset.target || 'f-categoria');
    if (target) {
      if (target.tagName === 'SELECT') {
        const existe = Array.prototype.some.call(target.options, function (op) {
          return normalizeText(op.value) === normalizeText(r.categoria);
        });
        if (!existe) {
          const opt = document.createElement('option');
          opt.value = r.categoria;
          opt.textContent = r.categoria;
          target.insertBefore(opt, target.lastElementChild || null);
        }
        target.setAttribute('data-cat-prev', r.categoria);
      }
      target.value = r.categoria;
      target.dispatchEvent(new Event('input', { bubbles: true }));
      target.dispatchEvent(new Event('change', { bubbles: true }));
      target.focus();
    }
    if (nameEl) nameEl.value = '';
    if (details) details.open = false;
    notify(r.creada ? 'Categoría "' + r.categoria + '" creada y seleccionada.' : 'La categoría "' + r.categoria + '" ya existía y quedó seleccionada.', 'success');
  } finally {
    if (el) el.disabled = false;
  }
}

function updateMovementFormFields() {
  const form = document.getElementById('form-movimiento');

  const tipo = form.querySelector('[name="Tipo"]');
  const paid = form.querySelector('[data-paid]');
  const paidInput = form.querySelector('[name="Monto_Pagado"]');
  const destination = form.querySelector('[data-transfer]');
  const destinationNote = form.querySelector('[data-transfer-note]');
  const paidNote = form.querySelector('[data-paid-note]');
  const esParcial = estado && estado.value === 'Parcial';
  const esPendiente = estado && estado.value === 'Pendiente';
  const transfer = tipo && String((stateData().tiposMeta && stateData().tiposMeta[tipo.value] || {}).naturaleza || '').toUpperCase() === 'TRANSFERENCIA';
  if (paid) paid.closest('.field').style.display = esParcial ? '' : 'none';

  if (destination) { destination.closest('.field').style.display = transfer ? '' : 'none'; destination.required = transfer; }
  if (destinationNote) destinationNote.style.display = transfer ? '' : 'none';
  const originLabel = form.querySelector('[name="Cuenta_Origen"]');
  if (originLabel) {
    const label = originLabel.closest('.field').querySelector('label');
    if (label) label.textContent = transfer ? 'Cuenta de origen *' : 'Cuenta *';
    originLabel.required = transfer || !esPendiente;
  }
}

/* Descargas y utilidades                                             */

function stamp() {
  const d = new Date();
  return localISO(d) + '_' + pad2(d.getHours()) + pad2(d.getMinutes());
}

function fileName(name) {
  return String(name || 'CONTROL').replace(/[\\/:*?"<>|]+/g, '-');
}

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName(name);
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  setTimeout(function () {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 1200);
}

function downloadBase64(name, base64, mime) {
  const clean = String(base64 || '').replace(/\s+/g, '');
  if (!clean) throw new Error('El archivo no contiene datos descargables.');
  const binary = atob(clean);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  downloadBlob(new Blob([bytes], { type: mime || 'application/octet-stream' }), name);
}

async function generarInformeRapido(tipo, periodo) {
  const o = { tipo: tipo };
  if (tipo === 'MENSUAL') o.periodo = periodo || currentMonth();
  if (tipo === 'PRESUPUESTOS' || tipo === 'ANUAL') o.periodo = periodo;
  if (tipo === 'GASTOS' || tipo === 'INGRESOS' || tipo === 'ABSOLUTO') {
    if (periodo) o.periodo = periodo;
    else o.periodo = currentMonth();
  }
  await generarInforme(o);
}

function formValues(form) {
  const out = {};
  Array.prototype.forEach.call(form.elements, function (el) {
    if (!el.name || el.disabled) return;
    if (el.type === 'checkbox') out[el.name] = !!el.checked;
    else if (el.type === 'radio') { if (el.checked) out[el.name] = el.value; }
    else out[el.name] = typeof el.value === 'string' ? el.value.trim() : el.value;
  });
  return out;
}

function setFormBusy(form, busy) {
  const buttons = Array.prototype.filter.call(document.querySelectorAll('button[type="submit"]'), function (b) { return b.form === form; });
  buttons.forEach(function (b) {
    b.disabled = !!busy;
    if (busy) {
      b.dataset.label = b.innerHTML;
      b.innerHTML = '<span class="spin"></span> Guardando…';
    } else if (b.dataset.label) {
      b.innerHTML = b.dataset.label;
      delete b.dataset.label;
    }
  });
}

const VIEWS = ['inicio', 'historico', 'movimientos', 'ingresos', 'gastos', 'facturacion', 'porpagar', 'presupuestos', 'inversiones', 'notificaciones', 'informes', 'ajustes'];

function goView(view, opciones) {
  const o = opciones || {};
  state.view = VIEWS.indexOf(view) >= 0 ? view : 'inicio';
  state.menuOpen = false;
  state.searchOpen = false;
  state.searchQ = '';
  state.searchResults = [];
  if (o.history !== false) {
    try { history.pushState({ view: state.view }, '', '#' + state.view); } catch (e) {}
  }
  render();
  if (state.view === 'ajustes') loadSistema();
  if (state.view === 'facturacion') sincronizarFacturacion(true);
  if (o.scroll !== false) {
    try { window.scrollTo(0, 0); } catch (e) {}
  }
  try {
    const main = document.getElementById('main');
    if (main) main.focus({ preventScroll: true });
  } catch (e) {}
}

function goSection(section) {
  if (section === 'ingresos') { goView('ingresos'); return; }
  if (section === 'gastos') { goView('gastos'); return; }
  if (section === 'absoluto') { goView('facturacion'); return; }
  const map = { pendientes: 'pendientes', inversiones: 'inversiones', resultado: 'todo', flujo: 'todo' };
  state.movFilter = map[section] || 'todo';
  state.movAdv = movAdvVacio();
  state.movSearch = '';
  state.movsRange = { preset: 'mes', desde: '', hasta: '' };
  state.movs = stateData().detalle || [];
  state.movsPeriodo = stateData().periodo || '';
  goView('movimientos');
}

function verMovimientosDePeriodo(clave) {
  const r = monthBounds(clave);
  state.movsRange = { preset: 'personalizado', desde: r.desde, hasta: r.hasta };
  state.movFilter = 'todo';
  state.movStatus = 'todos';
  state.movSearch = '';
  state.movAdv = movAdvVacio();
  goView('movimientos');
  loadMovements('personalizado', r.desde, r.hasta);
}

async function recargarMovimientosTrasCambio(data) {
  if (data) applyData(data);
  if (state.movsRange.preset !== 'mes') {
    await loadMovements();
    return;
  }
  state.movs = (data && data.detalle) || state.movs || [];
  state.movsPeriodo = (data && data.periodo) || state.movsPeriodo;
  render();
}

function payloadMovimiento(form) {
  const d = formValues(form);
  const meta = (stateData().tiposMeta || {})[d.Tipo] || {};
  const transferencia = String(meta.naturaleza || '').toUpperCase() === 'TRANSFERENCIA';
  if (d.Estado !== 'Parcial') delete d.Monto_Pagado;
  if (!transferencia) delete d.Cuenta_Destino;
  if (d.Estado === 'Parcial') {
    if (!d.Monto_Pagado || !(num(d.Monto_Pagado) > 0)) throw new Error('Indica el monto pagado del movimiento parcial.');
    if (num(d.Monto_Pagado) > num(d.Importe)) throw new Error('El monto pagado no puede superar el importe total.');
  }
  if (transferencia) {
    if (!d.Cuenta_Origen || !d.Cuenta_Destino) throw new Error('Selecciona la cuenta de origen y la de destino.');
    if (d.Cuenta_Origen === d.Cuenta_Destino) throw new Error('Las cuentas de origen y destino deben ser distintas.');
  }
  const copias = Math.max(1, Math.min(500, Math.floor(Number(d.Copias) || 1)));
  if (copias > 1) d.Copias = String(copias);
  else delete d.Copias;
  return d;
}

function payloadPago(form) {
  const d = formValues(form);
  if (!d.Dia_Ancla) delete d.Dia_Ancla;
  if (!d.Fecha_Fin) delete d.Fecha_Fin;
  return d;
}

function payloadEvento(form) {
  const d = formValues(form);
  d.Cada_Dias = Math.max(1, Math.floor(Number(d.Cada_Dias) || 1));
  d.Cada_Horas = Math.max(1, Math.floor(Number(d.Cada_Horas) || 1));
  if (!d.Frecuencia) d.Frecuencia = 'Única';
  if (!d.Hora) d.Hora = '09:00';
  return d;
}

function payloadPresupuesto(form) {
  const d = formValues(form);
  if (!d.ID_Presupuesto) delete d.ID_Presupuesto;
  return d;
}

function payloadInversion(form) {
  return formValues(form);
}

async function guardarFormularioMovimiento(form) {
  const d = payloadMovimiento(form);
  const ctx = state.formContext || {};
  const editando = ctx.kind === 'movimiento' && ctx.mode === 'edit' && ctx.id;
  if (editando) {
    const anterior = byId(state.movs, ctx.id) || byId(stateData().detalle, ctx.id) || byId(stateData().recientes, ctx.id);
    const respaldo = anterior ? Object.assign({}, anterior) : null;
    aplicarMovimientoLocal(Object.assign({}, anterior || {}, movimientoOptimistaDesdePayload(d, ctx.id), { id: ctx.id }));
    closeModal();
    render();
    notify('Guardando cambios del movimiento…', 'info');
    try {
      const r = await callConReintento('appActualizarMovimiento', TOKEN, ctx.id, d);
      if (r.movimiento) aplicarMovimientoLocal(r.movimiento);
      if (r.categorias) refrescarCatalogosLocales(r.categorias);
      render();
      notify('Movimiento actualizado.', 'success');
      refrescarRapido();
    } catch (err) {
      if (respaldo) aplicarMovimientoLocal(respaldo);
      render();
      throw err;
    }
    return;
  }
  const copias = Math.max(1, Math.min(500, Math.floor(Number(d.Copias) || 1)));
  const sello = Date.now();
  const tempIds = [];
  const base = Object.assign(movimientoOptimistaDesdePayload(d, ''), { optimista: true });
  for (let i = 0; i < copias; i++) {
    const tempId = 'temp-' + sello + '-' + i;
    tempIds.push(tempId);
    insertarOptimista(Object.assign({}, base, { id: tempId }));
  }
  closeModal();
  render();
  notify(copias > 1 ? 'Registrando ' + copias + ' movimientos…' : 'Registrando movimiento…', 'info');
  try {
    const r = await callConReintento('appCrearMovimiento', TOKEN, d);
    const reales = (r && r.movimientos && r.movimientos.length) ? r.movimientos : ((r && r.movimiento) ? [r.movimiento] : []);
    reemplazarLoteOptimista(tempIds, reales);
    if (r && r.categorias) refrescarCatalogosLocales(r.categorias);
    render();
    notify(copias > 1
      ? copias + ' movimientos registrados en una sola operación.'
      : 'Movimiento registrado.', 'success');
    refrescarRapido();
  } catch (err) {
    tempIds.forEach(function (tempId) {
      quitarOptimista(tempId);
      ajustarResumenLocal(base.naturaleza, base.pagadoMonto, -1);
    });
    render();
    throw err;
  }
}

  const form = e.target && e.target.closest ? e.target.closest('form[data-form]') : null;
  if (!form) return;
  e.preventDefault();
  const kind = form.getAttribute('data-form');
  const handler = FORM_HANDLERS[kind];
  if (!handler) { notify('Formulario no reconocido.', 'error'); return; }
  if (form.dataset.busy === '1') return;
  form.dataset.busy = '1';
  formError(form, '');
  setFormBusy(form, true);
  handler(form).catch(function (err) {
    formError(form, errMsg(err));
    notify(errMsg(err), 'error');
  }).then(function () {
    form.dataset.busy = '';
    setFormBusy(form, false);
  });
});

async function ejecutarAccion(action, el) {
  const id = el ? (el.dataset.id || '') : '';
  switch (action) {
    case 'go': goView(el.dataset.view); return;
    case 'go-section': goSection(el.dataset.section); return;
    case 'quick-menu': quickMenu(); return;
    case 'quick-capture': abrirCapturaRapida(el.dataset.kind); return;
    case 'create-category': await crearCategoriaUI(el); return;
    case 'focus-cat-creator': enfocarCreadorCategoria(el); return;
    case 'quick-delete': await eliminarRapidoUI(id, el.dataset.desc || ''); return;
    case 'fact-refresh': await refrescarFacturacionUI(); return;
    case 'fact-gran': state.factGran = el.dataset.gran || 'dia'; render(); return;
    case 'fact-range': state.factRango = el.dataset.range || 'mes'; render(); return;
    case 'nature-pdf': await generarInformeNaturaleza(el.dataset.kind || 'GASTO'); return;
    case 'open-form': closeSearch(); openForm(el.dataset.kind); return;
    case 'open-result': closeSearch(); openResult(el.dataset.type, id); return;
    case 'open-mov': await abrirDetalleMovimiento(id); return;
    case 'edit-mov': await editarMovimiento(id); return;
    case 'mov-abono': await abrirAbonoMovimiento(id); return;
    case 'mov-anular': anularMovimientoUI(id); return;
    case 'mov-confirmar': confirmarMovimientoUI(id); return;
    case 'abono-cancel': anularAbonoUI(id, el.dataset.mov || ''); return;
    case 'open-pago': await abrirDetallePago(id); return;
    case 'edit-pago': await editarPago(id); return;
    case 'pago-cancel': cancelarPagoUI(id); return;
    case 'edit-evento': await editarEvento(id); return;
    case 'evento-cancel': cancelarEventoUI(id); return;
    case 'inversion-edit': await editarInversion(id); return;
    case 'budget-edit': await editarPresupuesto(id); return;
    case 'budget-delete': desactivarPresupuestoUI(id); return;
    case 'hist-movs': verMovimientosDePeriodo(el.dataset.clave); return;
    case 'hist-pdf': await generarInforme({ tipo: 'MENSUAL', periodo: el.dataset.clave }); return;
    case 'hist-pdf-global': await generarInforme({ tipo: 'HISTORICO' }); return;
    case 'hist-cierre': await abrirCierre(el.dataset.clave); return;
    case 'cierre-confirmar': await confirmarCierre(el.dataset.clave); return;
    case 'cierre-reabrir': reabrirCierre(el.dataset.clave); return;
    case 'generate-quick': await generarInformeRapido(el.dataset.tipo); return;
    case 'budget-pdf': await generarInforme({ tipo: 'PRESUPUESTOS', periodo: el.dataset.periodo }); return;
    case 'report-generate': await generarInforme(); return;
    case 'report-download': await descargarInforme(id); return;
    case 'refresh':
      if (state.error) {
        state.loading = true;
        state.error = null;
        render();
        state.data = null;
        return boot();
      }
      await refreshData();
      if (state.view === 'ajustes') loadSistema(true);
      return;
    case 'refresh-movs': await loadMovements(); return;
    case 'load-movs-range': {
      const desde = (document.getElementById('mov-desde') || {}).value;
      const hasta = (document.getElementById('mov-hasta') || {}).value;
      if (!desde || !hasta) { notify('Selecciona las fechas desde y hasta.', 'error'); return; }
      await loadMovements('personalizado', desde, hasta);
      return;
    }
    case 'load-budget': {
      const input = document.getElementById('budget-period');
      await loadBudgets(input ? input.value : state.budgetPeriodo);
      return;
    }
    case 'reset-hist':
      state.histAnio = 'todos';
      state.histEstado = 'todos';
      state.histSearch = '';
      render();
      return;
    case 'reset-mov-adv':
      state.movAdv = movAdvVacio();
      state.movSearch = '';
      refrescarMovRegion();
      return;
    case 'notif-mark': await marcarNotificacion(id, 'Entregada'); return;
    case 'notif-cancel': await marcarNotificacion(id, 'Cancelada'); return;
    case 'notif-programar': await programarNotificaciones(); return;
    case 'notif-procesar': await procesarColaNotificaciones(); return;
    case 'notif-test-email': await probarAvisos(); return;
    case 'notif-permission': pedirPermisoNotificaciones(); return;
    case 'sync-calendar': await sincronizarCalendario(); return;
    case 'system-refresh': await loadSistema(true); return;
    case 'system-install': instalarSistemaUI(el.dataset.paso || 'todo'); return;
    case 'rotate-token': rotarTokenUI(); return;
    case 'copy-app-url': copiarEnlaceApp(); return;
    case 'install-app': instalarAppUI(); return;
    case 'install-prompt': await promptInstalacion(); return;
    case 'toggle-menu': state.menuOpen = !state.menuOpen; render(); return;
    case 'close-menu': state.menuOpen = false; render(); return;
    case 'modal-close': closeModal(); return;
    case 'close-toast': state.toast = null; renderToast(); return;
    case 'confirm-ok': await ejecutarConfirmacion(el); return;
    default: console.warn('Acción no reconocida: ' + action);
  }
}

document.addEventListener('click', function (e) {
  const backdrop = e.target.closest ? e.target.closest('[data-modal-backdrop]') : null;
  if (backdrop && e.target === backdrop) { closeModal(); return; }
  const el = e.target.closest ? e.target.closest('[data-action]') : null;
  if (el) {
    const action = el.getAttribute('data-action');
    if (el.tagName === 'BUTTON' || el.tagName === 'A') e.preventDefault();
    if ((el.tagName === 'BUTTON' || el.tagName === 'A') && esCampoEditable_(document.activeElement) && document.activeElement !== el) {
      try { document.activeElement.blur(); } catch (err) {}
    }
    if (action) {
      Promise.resolve(ejecutarAccion(action, el)).catch(function (err) { notify(errMsg(err), 'error'); });
    }
  }
  if (state.searchOpen && !(e.target.closest && e.target.closest('.search-wrap'))) closeSearch();
});

/* ------------------------------------------------------------------ */
/* Filtros, búsqueda y atajos                                         */
/* ------------------------------------------------------------------ */

let paySearchTimer = null;

function refrescarHistRegion() {
  const box = document.getElementById('hist-content');
  if (box) box.innerHTML = histContent();
}

function actualizarBarraAvanzada() {
  const activos = movAdvActivos();
  const count = document.getElementById('mov-adv-count');
  if (count) {
    count.textContent = String(activos);
    count.classList.toggle('hidden', !activos);
  }
  const reset = document.getElementById('mov-adv-reset');
  if (reset) reset.classList.toggle('hidden', !activos);
  const campos = {
    'mov-adv-categoria': 'categoria', 'mov-adv-tipo': 'tipo', 'mov-adv-min': 'min', 'mov-adv-max': 'max',
    'mov-adv-metodo': 'metodo', 'mov-adv-cuenta': 'cuenta', 'mov-adv-desde': 'desde', 'mov-adv-hasta': 'hasta', 'mov-adv-texto': 'texto'
  };
  Object.keys(campos).forEach(function (id) {
    const el = document.getElementById(id);
    const valor = state.movAdv[campos[id]] || '';
    if (el && String(el.value) !== String(valor)) el.value = valor;
  });
  const search = document.getElementById('mov-search');
  if (search && search.value !== state.movSearch) search.value = state.movSearch || '';
}

function refrescarMovRegion() {
  const box = document.getElementById('mov-region');
  if (box) box.innerHTML = movContent();
  const nat = document.getElementById('mov-nat-region');
  if (nat) nat.innerHTML = movNaturalezaContent(nat.getAttribute('data-kind') || 'GASTO');
  actualizarBarraAvanzada();
}

function refrescarPagosRegion() {
  const box = document.getElementById('pay-region');
  if (box) box.innerHTML = pagosContent();
}

document.addEventListener('change', function (e) {
  const cat = e.target;
  if (!cat || !cat.getAttribute || cat.getAttribute('data-cat-select') == null) return;
  if (cat.value === '__nueva__') {
    const prev = cat.getAttribute('data-cat-prev') || '';
    cat.value = prev;
    enfocarCreadorCategoria(cat);
  } else {
    cat.setAttribute('data-cat-prev', cat.value);
  }
});

document.addEventListener('change', function (e) {
  const el = e.target;
  const key = el && el.getAttribute ? el.getAttribute('data-change') : '';
  if (!key) return;
  marcarEdicion_();
  const value = el.value;
  if (key === 'hist-anio') { state.histAnio = value; refrescarHistRegion(); return; }
  if (key === 'hist-estado') { state.histEstado = value; refrescarHistRegion(); return; }
  if (key === 'mov-section') { state.movFilter = value; refrescarMovRegion(); return; }
  if (key === 'mov-status') { state.movStatus = value; refrescarMovRegion(); return; }
  if (key.indexOf('mov-adv-') === 0) {
    state.movAdv[key.replace('mov-adv-', '')] = value;
    refrescarMovRegion();
    return;
  }
  if (key === 'mov-tipo' || key === 'mov-estado') { updateMovementFormFields(); return; }
  if (key === 'movs-preset') {
    state.movsRange.preset = value;
    if (value === 'personalizado') {
      try { el.blur(); } catch (e2) {}
      render();
    } else loadMovements(value);
    return;
  }
  if (key === 'movs-desde') { state.movsRange.desde = value; return; }
  if (key === 'movs-hasta') { state.movsRange.hasta = value; return; }
  if (key === 'budget-period') { state.budgetPeriodo = value; return; }
  if (key === 'report-tipo') {
    state.reportTipo = value;
    try { el.blur(); } catch (e2) {}
    render();
    return;
  }
  if (key === 'report-periodo') { state.reportPeriodo = value; return; }
  if (key === 'report-anio') { state.reportAnio = value; return; }
  if (key === 'report-desde') { state.reportDesde = value; return; }
  if (key === 'report-hasta') { state.reportHasta = value; return; }
});

document.addEventListener('input', function (e) {
  const el = e.target;
  if (!el) return;
  marcarEdicion_();
  if (el.id === 'global-search') { handleSearchInput(el.value); return; }
  if (el.id === 'hist-search') {
    state.histSearch = el.value;
    if (histSearchTimer) clearTimeout(histSearchTimer);
    histSearchTimer = setTimeout(refrescarHistRegion, 180);
    return;
  }
  if (el.id === 'mov-search') {
    state.movSearch = el.value;
    if (movSearchTimer) clearTimeout(movSearchTimer);
    movSearchTimer = setTimeout(refrescarMovRegion, 180);
    return;
  }
  const advKey = el.getAttribute ? el.getAttribute('data-adv') : '';
  if (advKey) {
    state.movAdv[advKey] = el.value;
    if (movAdvTimer) clearTimeout(movAdvTimer);
    movAdvTimer = setTimeout(refrescarMovRegion, 200);
    return;
  }
  if (el.id === 'pay-search') {
    state.paySearch = el.value;
    if (paySearchTimer) clearTimeout(paySearchTimer);
    paySearchTimer = setTimeout(refrescarPagosRegion, 180);
  }
});

function enfocarResultadoBusqueda(dir) {
  const items = Array.prototype.slice.call(document.querySelectorAll('#search-dropdown .search-result'));
  if (!items.length) return;
  const actual = document.activeElement;
  let idx = items.indexOf(actual);
  if (idx < 0) idx = dir > 0 ? -1 : 0;
  const next = (idx + dir + items.length) % items.length;
  items[next].focus();
}

function focusablesModal() {
  const modal = document.querySelector('#modal-root .modal');
  if (!modal) return [];
  return Array.prototype.filter.call(
    modal.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]):not([type="hidden"]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'),
    function (elm) { return elm.offsetWidth > 0 || elm.offsetHeight > 0 || elm === document.activeElement; }
  );
}

document.addEventListener('keydown', function (e) {
  const key = String(e.key || '');
  if (e.target && (esCampoEditable_(e.target) || (e.target.closest && e.target.closest('#modal-root')))) marcarEdicion_();
  if ((e.metaKey || e.ctrlKey) && key.toLowerCase() === 'k') {
    e.preventDefault();
    const input = document.getElementById('global-search');
    if (input) { input.focus(); input.select(); }
    return;
  }
  if (key === 'Escape') {
    if (state.modal) { e.preventDefault(); closeModal(); return; }
    if (state.searchOpen) { closeSearch(); return; }
    if (state.menuOpen) { state.menuOpen = false; render(); return; }
  }
  if (key === 'Tab' && state.modal) {
    const items = focusablesModal();
    if (!items.length) return;
    const first = items[0];
    const last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    return;
  }
  if (key === 'ArrowDown' && document.activeElement && document.activeElement.id === 'global-search') {
    e.preventDefault();
    enfocarResultadoBusqueda(1);
    return;
  }
  if ((key === 'ArrowDown' || key === 'ArrowUp') && document.activeElement && document.activeElement.classList.contains('search-result')) {
    e.preventDefault();
    enfocarResultadoBusqueda(key === 'ArrowDown' ? 1 : -1);
  }
});

document.addEventListener('focusin', function (e) {
  if (e.target && (esCampoEditable_(e.target) || (e.target.closest && e.target.closest('#modal-root')))) marcarEdicion_();
  if (e.target && e.target.id === 'global-search') {
    if (state.searchQ && state.searchQ.trim().length >= 2) {
      state.searchOpen = true;
      updateSearchDropdown();
    }
  }
});

document.addEventListener('focusout', function (e) {
  if (esCampoEditable_(e.target)) programarFlushRender_();
});

window.addEventListener('popstate', aplicarRuta);
window.addEventListener('hashchange', aplicarRuta);

window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  state.installPrompt = e;
});

window.addEventListener('appinstalled', function () {
  state.installPrompt = null;
  notify('CONTROL quedó instalada en este dispositivo.', 'success');
});

function aplicarRuta() {
  const hash = String(location.hash || '').replace('#', '');
  if (VIEWS.indexOf(hash) >= 0 && hash !== state.view) {
    state.view = hash;
    state.menuOpen = false;
    state.searchOpen = false;
    render();
    if (hash === 'ajustes') loadSistema();
  }
}

/* ------------------------------------------------------------------ */
/* Actualización en vivo                                              */
/* ------------------------------------------------------------------ */

let liveTimer = null;
let liveTick = 0;

function refrescoEnVivo() {
  if (document.hidden || state.loading || state.error) return;
  if (controlPeticionesActivas_ > 0) return;
  liveTick++;
  // La sincronización de facturación corre con su propio temporizador (5 min) para no interrumpir la escritura.
  const ocupado = hayEdicionActiva_(2500);
  if (liveTick % 3 === 0 && !ocupado && ['inicio', 'historico', 'movimientos', 'ingresos', 'gastos'].indexOf(state.view) >= 0) {
    refrescarRapido();
  } else if (liveTick % 3 === 0 && !ocupado && state.view === 'notificaciones' && typeof refrescarNotificaciones === 'function') {
    refrescarNotificaciones();
  }
}

function iniciarTiempoReal() {
  if (liveTimer) return;
  liveTimer = setInterval(refrescoEnVivo, 20000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) setTimeout(refrescoEnVivo, 700);
  });
  window.addEventListener('focus', function () { setTimeout(refrescoEnVivo, 700); });
}

iniciarTiempoReal();
boot();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (err) {
      console.warn('Service worker:', err);
    });
  });
}
</script>
